space-between;align-items:center;gap:6px;margin-bottom:4px}.footer{font-size:12px;color:#879187;text-align:center;padding:30px 15px}.brief{font-size:13px;color:var(--sub);padding:8px 0}.pill{font-size:11px;background:var(--wash);padding:2px 8px;border-radius:20px;color:var(--accent)}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.warning{background:#fff8ed;border:1px solid #e6d7bb;border-radius:14px;padding:12px 14px;color:#705f41;font-size:13px}summary{cursor:pointer}a{color:var(--accent)}@media(max-width:400px){.container{padding:12px 12px 80px}.hero{padding:24px 18px}h1{font-size:27px}.grid{gap:8px}.word{padding:12px 10px}.tabs{gap:2px}.tab{padding:7px 10px}}

<script>
'use strict';
const WORDS=[{"id":1,"name":"从容","chapter":"第一章  内心的境界","layers":["有事可做时尽力，无事可做时安住。","小时候：以为从容就是走路不急、说话不慌。\n年轻时：以为只要把所有问题解决，自己自然就会从容。\n经历半生：明白从容不是没有难题，而是知道何时行动、何时等待。","误区：从容不是慢吞吞，也不是对重要的事不在乎。","生活修炼：把需要自己做的事认真完成，把暂时无法决定的事交给时间。","金句：从容不是人生无风雨，而是风雨之中仍能选择自己的步伐。"]},{"id":2,"name":"平静","chapter":"第一章  内心的境界","layers":["风浪尚在，心不必一直翻涌。","小时候：以为平静就是周围没有争吵、没有烦恼。\n年轻时：以为事情都顺利、所有问题都有答案，心才能平静。\n经历半生：知道问题可以存在，心也可以慢慢安顿。","误区：平静不是压抑难过，更不是要求自己永远不焦虑。","生活修炼：等待消息时设定跟进节点，焦虑出现就觉察它，再回到今天可做的事。","金句：平静不是所有事情都有了答案，而是答案未到时仍能安心生活。"]},{"id":3,"name":"收放","chapter":"第一章  内心的境界","layers":["急事缓说，大事静办。","小时候：以为沉稳就是话少、板着脸。\n年轻时：觉得反应快、表态早，才显得有能力。\n经历半生：明白沉稳不是不着急，而是知道哪一步该慢下来。","沉稳不是没有情绪，而是不让情绪替自己做决定。","收到让人心乱的消息，先放一小时再回复；把要说的话写在纸上，删掉带气的两句再开口。","沉稳不是天生话少，而是把力气从争一时的输赢，转到把事情真正办成。"]},{"id":4,"name":"安宁","chapter":"第一章  内心的境界","layers":["让自己拥有可以休憩的内在家园。","小时候：常把它理解为“不哭、不慌、表现得很好”。\n年轻时：容易希望先把外面的事情处理妥当，心里才允许自己安定。\n经历半生：再看“安宁”，才更懂得——让自己拥有可以休憩的内在家园。","安宁不是躲开人群，而是心里有一处不必时时迎战的地方。","每天留十分钟不处理消息，让呼吸和注意力慢慢落回自己。","真正的安宁，不是一句说出口的道理，而是每天愿意践行的选择。让自己拥有可以休憩的内在家园。"]},{"id":5,"name":"淡然","chapter":"第一章  内心的境界","layers":["认真看待得失，却不让得失决定心情。","小时候：常把它理解为“不哭、不慌、表现得很好”。\n年轻时：容易希望先把外面的事情处理妥当，心里才允许自己安定。\n经历半生：再看“淡然”，才更懂得——认真看待得失，却不让得失决定心情。","淡然不是冷漠，重要的事仍值得热爱。","收到好消息时庆祝，遇到失误时复盘，别把任何一次结果当成人生总评。","真正的淡然，不是一句说出口的道理，而是每天愿意践行的选择。认真看待得失，却不让得失决定心情。"]},{"id":6,"name":"淡泊","chapter":"第一章  内心的境界","layers":["热闹里不急着挤，冷清时不觉得亏。","小时候：以为淡泊就是不争不抢、什么都可以。\n年轻时：容易把淡泊当成没有追求、不上进的借口。\n经历半生：懂得淡泊是把想要的东西排了序，不必样样都要。","淡泊不是没有欲望，而是不让欲望替自己定人生的标准。","每月挑一件「其实不必要」的支出跳过，把省下的钱和时间留给自己真正在意的事。","淡泊不是把生活过得寡淡，而是把心从别人的热锅里端出来。"]},{"id":7,"name":"坦然","chapter":"第一章  内心的境界","layers":["不粉饰现实，也不回避自己的感受。","小时候：常把它理解为“不哭、不慌、表现得很好”。\n年轻时：容易希望先把外面的事情处理妥当，心里才允许自己安定。\n经历半生：再看“坦然”，才更懂得——不粉饰现实，也不回避自己的感受。","坦然不是没有难堪，而是能诚实承认它。","说出“我现在确实担心”，再辨认担心中的事实与想象。","真正的坦然，不是一句说出口的道理，而是每天愿意践行的选择。不粉饰现实，也不回避自己的感受。"]},{"id":8,"name":"豁达","chapter":"第一章  内心的境界","layers":["把眼前的一件事放回整个人生里。","小时候：常把它理解为“不哭、不慌、表现得很好”。\n年轻时：容易希望先把外面的事情处理妥当，心里才允许自己安定。\n经历半生：再看“豁达”，才更懂得——把眼前的一件事放回整个人生里。","豁达不是轻视损失，而是不让损失定义余生。","把今天最烦恼的事放到五年后的视角重新看一遍。","真正的豁达，不是一句说出口的道理，而是每天愿意践行的选择。把眼前的一件事放回整个人生里。"]},{"id":9,"name":"素心","chapter":"第一章  内心的境界","layers":["被照亮时不慌，被错过时不怨。","小时候：以为坦然就是脸皮厚、不在乎。\n年轻时：容易被夸奖和批评两头牵着走，情绪随人起伏。\n经历半生：慢慢懂得，坦然是知道自己的分量，不靠外人称量。","坦然不是无所谓，而是把自己的评价权拿回自己手里。","听到一句评价，先问自己：这条评论我认不认？认的就改，不认的就谢过。","坦然不是听不见别人说什么，而是听得见，也放得下。"]},{"id":10,"name":"通透","chapter":"第一章  内心的境界","layers":["看见复杂，也看见哪些事情不值得纠缠。","小时候：常把它理解为“不哭、不慌、表现得很好”。\n年轻时：容易希望先把外面的事情处理妥当，心里才允许自己安定。\n经历半生：再看“通透”，才更懂得——看见复杂，也看见哪些事情不值得纠缠。","通透不是看透别人后失去信任，而是懂得复杂仍愿善待。","面对复杂关系时，先问“我需要理解多少，才足够作出选择？”","真正的通透，不是一句说出口的道理，而是每天愿意践行的选择。看见复杂，也看见哪些事情不值得纠缠。"]},{"id":11,"name":"自在","chapter":"第一章  内心的境界","layers":["不因别人的目光而时时调整自己。","小时候：常把它理解为“不哭、不慌、表现得很好”。\n年轻时：容易希望先把外面的事情处理妥当，心里才允许自己安定。\n经历半生：再看“自在”，才更懂得——不因别人的目光而时时调整自己。","自在不是任性，而是不再时时向外界解释自己。","减少一次仅仅为了别人评价而作的决定。","真正的自在，不是一句说出口的道理，而是每天愿意践行的选择。不因别人的目光而时时调整自己。"]},{"id":12,"name":"定力","chapter":"第一章  内心的境界","layers":["心不被每一阵风带走。","小时候：以为定力就是能坐得住、忍得了。\n年轻时：容易同时开太多头，听到新的机会就想换方向。\n经历半生：知道定力不是不动，而是在动的时候还认得自己要去的方向。","定力不是固执，也不是对变化视而不见。","给自己定一个三个月不做改动的目标，任何新的诱惑先记在本子上，三个月后再看。","定力不是把门关上，而是在门开着的时候，依然知道自己要去哪里。"]},{"id":13,"name":"安然","chapter":"第一章  内心的境界","layers":["在不确定中保有基本的踏实。","小时候：常把它理解为“不哭、不慌、表现得很好”。\n年轻时：容易希望先把外面的事情处理妥当，心里才允许自己安定。\n经历半生：再看“安然”，才更懂得——在不确定中保有基本的踏实。","安然不是确认没有风险，而是相信有办法逐步应对。","写下自己的应急资源与求助对象，给不确定性一个现实支点。","真正的安然，不是一句说出口的道理，而是每天愿意践行的选择。在不确定中保有基本的踏实。"]},{"id":14,"name":"宁静","chapter":"第一章  内心的境界","layers":["给纷杂的念头留出安静的空隙。","小时候：常把它理解为“不哭、不慌、表现得很好”。\n年轻时：容易希望先把外面的事情处理妥当，心里才允许自己安定。\n经历半生：再看“宁静”，才更懂得——给纷杂的念头留出安静的空隙。","宁静不只存在于安静的房间，也来自不追逐每个念头。","散步时暂时不听音频，让心从信息中休息。","真正的宁静，不是一句说出口的道理，而是每天愿意践行的选择。给纷杂的念头留出安静的空隙。"]},{"id":15,"name":"静气","chapter":"第一章  内心的境界","layers":["先让自己静下来，再看这件事。","小时候：以为静气就是安安静静、不吵不闹。\n年轻时：遇到事第一反应是找人商量、找人诉说，靠外面的声音安抚自己。\n经历半生：发现最有用的答案，往往在自己安静下来的那几分钟里。","静气不是闷在心里不说，而是先给自己一点时间。","做决定前先走十分钟路，不带手机，让念头自己慢下来。","静气不是与世隔绝的安静，而是喧闹之中，自己还有一间能关门的房间。"]},{"id":16,"name":"笃定","chapter":"第一章  内心的境界","layers":["不急于证明，但知道自己珍视什么。","小时候：常把它理解为“不哭、不慌、表现得很好”。\n年轻时：容易希望先把外面的事情处理妥当，心里才允许自己安定。\n经历半生：再看“笃定”，才更懂得——不急于证明，但知道自己珍视什么。","笃定不等于固执，知道方向的人也可以改变路径。","写出你最珍惜的三项价值，用它们评估一个新机会。","真正的笃定，不是一句说出口的道理，而是每天愿意践行的选择。不急于证明，但知道自己珍视什么。"]},{"id":17,"name":"清醒","chapter":"第一章  内心的境界","layers":["认清事实、欲望与恐惧的不同。","小时候：常把它理解为“不哭、不慌、表现得很好”。\n年轻时：容易希望先把外面的事情处理妥当，心里才允许自己安定。\n经历半生：再看“清醒”，才更懂得——认清事实、欲望与恐惧的不同。","清醒不是苛刻，而是不拿希望替代事实。","重大投资前将事实、假设、愿望分别列在三栏。","真正的清醒，不是一句说出口的道理，而是每天愿意践行的选择。认清事实、欲望与恐惧的不同。"]},{"id":18,"name":"宽心","chapter":"第一章  内心的境界","layers":["把心胸腾出一点空，事情就不那么挤。","小时候：以为宽心就是别人错了也不计较。\n年轻时：容易把每件小事都当成人生的关口，反复咀嚼。\n经历半生：明白宽心多半不是原谅别人，而是不再让自己反复受同一件小事折磨。","宽心不是没有原则地退让，也不是把委屈都咽下去。","睡前写下今天最在意的一件小事，问自己：一年后还重要吗？大概率不重要。","宽心不是放过别人，而是先把自己从这件事里领出来。"]},{"id":19,"name":"取舍","chapter":"第二章  人生的智慧","layers":["承认精力有限，把重要的放在前面。","小时候：以为取舍就是在两样东西中挑一个喜欢的。\n年轻时：想尽可能全都拥有，害怕任何放弃都是损失。\n经历半生：知道时间和精力有限，真正重要的东西需要腾出位置。","误区：取舍不是越少越好，而是让留下来的更值得。","生活修炼：把日常工作分成必须亲自做、可授权、可停止三类。","金句：取舍不是失去更多，而是为最重要的生活留下空间。"]},{"id":20,"name":"放下","chapter":"第二章  人生的智慧","layers":["不再要求过去或他人按我的愿望改变。","小时候：以为放下就是松开手，把东西放回原处。\n年轻时：以为放下就是放弃，甚至是承认自己输了。\n经历半生：明白放下是停止向不可改变的部分继续索取答案。","误区：放下不等于不爱、不负责，更不等于假装不痛。","生活修炼：把该行动的事写在计划里，把反复想却改变不了的事暂时留白。","金句：放下的是执念，不是珍惜；放手的是控制，不是理想。"]},{"id":21,"name":"进退","chapter":"第二章  人生的智慧","layers":["该上的时候上，该退的时候退。","小时候：以为进退就是听大人的话，叫走就走。\n年轻时：容易只懂往前冲，把退一步看成认输。\n经历半生：才知道退常常是为了走得更远，不是失败。","进退不是精于算计，也不是处处退让。","面对一场争执，先问：这件事赢了对我有什么用？没有用的，主动说一句「这事我们改天聊」。","进退不是会看风向，而是知道自己的目的地在哪，然后选择一条走得到的路。"]},{"id":22,"name":"接纳","chapter":"第二章  人生的智慧","layers":["允许现实先如实存在，再决定如何行动。","小时候：以为接纳就是同意别人，什么都说好。\n年轻时：遇到不如意，常觉得接纳就是认输。\n经历半生：懂得先承认现实存在，才有余地选择下一步。","误区：接纳不等于赞同伤害，也不等于停止改善。","生活修炼：对不能改变的事实说“它已经这样了”，然后问“我还能怎样照顾现在的生活”。","金句：接纳不是喜欢所有发生的事，而是不再否认它已经发生。"]},{"id":23,"name":"顺其自然","chapter":"第二章  人生的智慧","layers":["尽力之后，尊重事物自己的节奏。","小时候：以为做到它就是“听话、懂事、做对选择”。\n年轻时：常以为只要足够努力，便能把每一件事安排得恰到好处。\n经历半生：再看“顺其自然”，才更懂得——尽力之后，尊重事物自己的节奏。","顺其自然不是不作为，而是尽力之后不强求。","做完该做的准备，约定下次检查时间，中间不反复催促自己。","真正的顺其自然，不是一句说出口的道理，而是每天愿意践行的选择。尽力之后，尊重事物自己的节奏。"]},{"id":24,"name":"取舍之间","chapter":"第二章  人生的智慧","layers":["选了这一样，就好好告别另一样。","小时候：以为取舍就是挑好的、扔坏的。\n年轻时：容易什么都想要，结果每一样都只拿了一点点。\n经历半生：懂得取舍真正难的不是选，是选完以后不回头。","取舍不是精明的权衡，而是承认自己没有无限的时间。","每次答应新事情之前，先想清楚要放下哪一件；说不出口的放下，就先别答应。","取舍的成熟，不是选得都对，而是选完以后，认真对待自己没选的那条路。"]},{"id":25,"name":"知足","chapter":"第二章  人生的智慧","layers":["看见已有的丰盛，同时保留向前的心。","小时候：以为知足是不要再想得到更多。\n年轻时：担心知足会削弱奋斗的动力。\n经历半生：明白可以有追求，也能真切感受已经拥有的幸福。","误区：知足不是自我设限，更不是对不合理状况妥协。","生活修炼：在规划下一步之前，先写下今天最值得珍惜的三件事。","金句：知足不是停止向前，而是向前时不辜负已有的风景。"]},{"id":26,"name":"克制","chapter":"第二章  人生的智慧","layers":["不让一时冲动替长期的自己作决定。","小时候：以为做到它就是“听话、懂事、做对选择”。\n年轻时：常以为只要足够努力，便能把每一件事安排得恰到好处。\n经历半生：再看“克制”，才更懂得——不让一时冲动替长期的自己作决定。","克制不是压抑一切快乐，而是给长远选择留空间。","遇到冲动消费或重大决定，先给自己一天冷静期。","真正的克制，不是一句说出口的道理，而是每天愿意践行的选择。不让一时冲动替长期的自己作决定。"]},{"id":27,"name":"装糊涂","chapter":"第二章  人生的智慧","layers":["有些事看清了，也不必点破。","小时候：以为装糊涂就是笨、就是不懂。\n年轻时：急着证明自己看得明白，什么都想指出来。\n经历半生：明白很多时候，让对方体面，比让对方服气更有价值。","装糊涂不是真糊涂，也不是纵容错误。","听到一句不够准确的话，先判断：纠正它能改善什么？改善不了，就留给他自己。","装糊涂不是看不清，而是看清了以后，选择不说。"]},{"id":28,"name":"适度","chapter":"第二章  人生的智慧","layers":["让努力与休息都处在能够持续的位置。","小时候：以为做到它就是“听话、懂事、做对选择”。\n年轻时：常以为只要足够努力，便能把每一件事安排得恰到好处。\n经历半生：再看“适度”，才更懂得——让努力与休息都处在能够持续的位置。","适度不是处处折中，而是辨认真正合适的程度。","安排工作上限和固定休息时间，而不只安排任务。","真正的适度，不是一句说出口的道理，而是每天愿意践行的选择。让努力与休息都处在能够持续的位置。"]},{"id":29,"name":"分寸","chapter":"第二章  人生的智慧","layers":["知道什么时候靠近，什么时候留白。","小时候：以为做到它就是“听话、懂事、做对选择”。\n年轻时：常以为只要足够努力，便能把每一件事安排得恰到好处。\n经历半生：再看“分寸”，才更懂得——知道什么时候靠近，什么时候留白。","分寸不是疏远，而是让靠近也有呼吸的空间。","帮助亲近的人前，先询问“你需要我陪伴还是给建议？”","真正的分寸，不是一句说出口的道理，而是每天愿意践行的选择。知道什么时候靠近，什么时候留白。"]},{"id":30,"name":"随遇","chapter":"第二章  人生的智慧","layers":["到了哪里，就把哪里过成日子。","小时候：以为随遇就是随便、将就。\n年轻时：容易一直在等「更好的地方」，眼前的都不算数。\n经历半生：才知道随遇不是降低标准，而是先把手边这一点过好。","随遇不是放弃计划，也不是随波逐流。","出差或换环境时，第一天先找一件让自己舒服的小事做，比如一间能走路的公园。","随遇不是认命，而是在哪里都能为自己安放一张椅子。"]},{"id":31,"name":"边界","chapter":"第二章  人生的智慧","layers":["理解善意与责任都不必没有尽头。","小时候：以为做到它就是“听话、懂事、做对选择”。\n年轻时：常以为只要足够努力，便能把每一件事安排得恰到好处。\n经历半生：再看“边界”，才更懂得——理解善意与责任都不必没有尽头。","边界不是拒绝关心，而是不把所有责任据为己有。","明确哪些决定由团队负责，哪些必须由自己签字。","真正的边界，不是一句说出口的道理，而是每天愿意践行的选择。理解善意与责任都不必没有尽头。"]},{"id":32,"name":"舍得","chapter":"第二章  人生的智慧","layers":["为真正重要的事腾出时间和空间。","小时候：以为做到它就是“听话、懂事、做对选择”。\n年轻时：常以为只要足够努力，便能把每一件事安排得恰到好处。\n经历半生：再看“舍得”，才更懂得——为真正重要的事腾出时间和空间。","舍得不是以牺牲换回报，而是懂得不同选择各有代价。","接受一个项目不做，可能是在为健康与陪伴腾出空间。","真正的舍得，不是一句说出口的道理，而是每天愿意践行的选择。为真正重要的事腾出时间和空间。"]},{"id":33,"name":"留白","chapter":"第二章  人生的智慧","layers":["不必把每一天都填满。","小时候：以为留白就是空着、闲着。\n年轻时：习惯把日程排满，空下来反而心慌。\n经历半生：发现很多想不明白的事，是在没有安排的时间里想通的。","留白不是懒散，也不是浪费光阴。","每周留半天不做计划，不补工作，允许自己想干什么就干什么。","留白不是空无一物，而是给还没长出来的东西，留出土地。"]},{"id":34,"name":"释怀","chapter":"第二章  人生的智慧","layers":["不让已经过去的事反复占据今天。","小时候：以为做到它就是“听话、懂事、做对选择”。\n年轻时：常以为只要足够努力，便能把每一件事安排得恰到好处。\n经历半生：再看“释怀”，才更懂得——不让已经过去的事反复占据今天。","释怀不是遗忘，而是回忆不再反复伤害今天。","写下旧事给你的提醒，然后停止反复重演当时的对话。","真正的释怀，不是一句说出口的道理，而是每天愿意践行的选择。不让已经过去的事反复占据今天。"]},{"id":35,"name":"随缘","chapter":"第二章  人生的智慧","layers":["认真创造相遇的条件，不强留结果。","小时候：以为做到它就是“听话、懂事、做对选择”。\n年轻时：常以为只要足够努力，便能把每一件事安排得恰到好处。\n经历半生：再看“随缘”，才更懂得——认真创造相遇的条件，不强留结果。","随缘不是不争取，而是不把缘分变成占有。","真诚表达心意，也给对方自由回应的空间。","真正的随缘，不是一句说出口的道理，而是每天愿意践行的选择。认真创造相遇的条件，不强留结果。"]},{"id":36,"name":"退一步","chapter":"第二章  人生的智慧","layers":["退开半步，才看得见整幅画。","小时候：以为退一步就是认错、吃亏。\n年轻时：容易被「不能输了这口气」推着往前走。\n经历半生：知道很多争执里没有赢家，只有先退的人先松了一口气。","退一步不是软弱，也不是放弃立场。","情绪上来的时候，先说一句「我回去想想」，把对话暂停下来，明天再谈。","退一步不是站在后面，而是站到能看清全局的位置。"]},{"id":37,"name":"坚韧","chapter":"第三章  生命的力量","layers":["会受伤也会恢复，仍愿意走下去。","小时候：觉得它意味着“什么都不怕、什么都能做到”。\n年轻时：常把它和咬牙硬撑、不肯认输联系起来。\n经历半生：再看“坚韧”，才更懂得——会受伤也会恢复，仍愿意走下去。","坚韧不是从不崩溃，而是受伤后允许自己恢复。","遭遇挫折后先恢复睡眠与节奏，再决定是否重新出发。","真正的坚韧，不是一句说出口的道理，而是每天愿意践行的选择。会受伤也会恢复，仍愿意走下去。"]},{"id":38,"name":"勇敢","chapter":"第三章  生命的力量","layers":["心里有怕，脚下仍能迈出一步。","小时候：觉得它意味着“什么都不怕、什么都能做到”。\n年轻时：常把它和咬牙硬撑、不肯认输联系起来。\n经历半生：再看“勇敢”，才更懂得——心里有怕，脚下仍能迈出一步。","勇敢不是没有恐惧，而是恐惧中仍能行动。","把让你犹豫的大事拆成一个今天就能完成的小行动。","真正的勇敢，不是一句说出口的道理，而是每天愿意践行的选择。心里有怕，脚下仍能迈出一步。"]},{"id":39,"name":"生机","chapter":"第三章  生命的力量","layers":["活着本身就是一件有劲的事。","小时候：以为生机就是草木发芽、春天来了。\n年轻时：容易把日子过成任务清单，忘了自己也是个活着的人。\n经历半生：明白真正的生机不在外面，而在你还愿意为某件小事眼睛一亮。","生机不是一直亢奋，也不是不许自己累。","每周做一件「没用但让自己开心」的事：逛一次花市、听一整张专辑、走一条没走过的路。","生机不是永远年轻，而是心里始终有一块地，愿意种东西。"]},{"id":40,"name":"承担","chapter":"第三章  生命的力量","layers":["愿意接下这件事，就已经长了一截。","小时候：以为承担就是乖乖认错、不推给别人。\n年轻时：容易怕担责任，遇事先想怎么解释自己。\n经历半生：明白愿意承担责任的人，反而获得更多信任和机会。","承担不是把所有过错都揽到自己身上。","事情出了岔子，先说「这部分我来处理」，再谈原因和分工。","承担不是背起所有人的重担，而是不让自己该背的那一份落到别人身上。"]},{"id":41,"name":"坚持","chapter":"第三章  生命的力量","layers":["为了值得的方向，持续做小而正确的事。","小时候：觉得它意味着“什么都不怕、什么都能做到”。\n年轻时：常把它和咬牙硬撑、不肯认输联系起来。\n经历半生：再看“坚持”，才更懂得——为了值得的方向，持续做小而正确的事。","坚持不是不知变通，方向值得也需要方法合适。","每隔一段时间检查目标是否仍值得，以及方法是否应改变。","真正的坚持，不是一句说出口的道理，而是每天愿意践行的选择。为了值得的方向，持续做小而正确的事。"]},{"id":42,"name":"热情","chapter":"第三章  生命的力量","layers":["对世界还有兴趣，人就还年轻。","小时候：以为热情就是大声说话、跑得很快。\n年轻时：热情来得快也去得快，喜欢一样东西往往只有三个月。\n经历半生：才发现能把一件事做二十年的人，靠的不是热情，是把热情养住了。","热情不是一时上头的冲动，也不是不许自己厌倦。","给自己的一件喜欢的事定一个「最低坚持量」，比如每天十分钟，不追求多，只追求不断。","热情不是一直燃烧，而是熄了以后，还愿意再去点一次。"]},{"id":43,"name":"毅力","chapter":"第三章  生命的力量","layers":["在看不到立即回报时，仍保持行动。","小时候：觉得它意味着“什么都不怕、什么都能做到”。\n年轻时：常把它和咬牙硬撑、不肯认输联系起来。\n经历半生：再看“毅力”，才更懂得——在看不到立即回报时，仍保持行动。","毅力不是透支身体，而是找到能长期持续的节奏。","为长期计划设一个可以坚持数年的小习惯。","真正的毅力，不是一句说出口的道理，而是每天愿意践行的选择。在看不到立即回报时，仍保持行动。"]},{"id":44,"name":"熬得住","chapter":"第三章  生命的力量","layers":["难的时候不急着下结论。","小时候：以为熬就是硬撑、不能哭。\n年轻时：遇到长时间的低谷，容易怀疑自己走错了路。\n经历半生：发现很多关口不是因为办法好才过去的，是因为还没放弃。","熬得住不是无限忍耐，也不是不求助。","给难熬的阶段定一个期限，比如三个月；到期认真复盘一次，再决定继续还是调整。","熬得住不是不怕苦，而是知道苦有尽头，所以愿意再走一段。"]},{"id":45,"name":"朝气","chapter":"第三章  生命的力量","layers":["把每一天当成新的开始。","小时候：以为朝气就是早起、精神好。\n年轻时：容易觉得朝气是年轻人的专利。\n经历半生：明白真正显老的不是皱纹，是「反正也就这样了」这句话。","朝气不是不知疲倦，也不是硬撑。","每天早上说一句：「今天还有一件值得期待的事」，找不到就想一件，哪怕是晚饭。","朝气不是没有年纪，而是不管几岁，都还愿意为明天准备点什么。"]},{"id":46,"name":"自信","chapter":"第三章  生命的力量","layers":["相信自己能学习与应对，而非保证成功。","小时候：觉得它意味着“什么都不怕、什么都能做到”。\n年轻时：常把它和咬牙硬撑、不肯认输联系起来。\n经历半生：再看“自信”，才更懂得——相信自己能学习与应对，而非保证成功。","自信不是确信会赢，而是相信输了也可以再学。","回忆三次你曾经适应未知的经历，而不要求保证下一次成功。","真正的自信，不是一句说出口的道理，而是每天愿意践行的选择。相信自己能学习与应对，而非保证成功。"]},{"id":47,"name":"自强","chapter":"第三章  生命的力量","layers":["不把命运完全交给外部条件。","小时候：觉得它意味着“什么都不怕、什么都能做到”。\n年轻时：常把它和咬牙硬撑、不肯认输联系起来。\n经历半生：再看“自强”，才更懂得——不把命运完全交给外部条件。","自强不是拒绝帮助，而是不放弃对人生的参与。","遇到难题，先想自己能做的第一步，也允许请专家协助。","真正的自强，不是一句说出口的道理，而是每天愿意践行的选择。不把命运完全交给外部条件。"]},{"id":48,"name":"向光","chapter":"第三章  生命的力量","layers":["知道自己朝哪边生长。","小时候：以为向光就是喜欢太阳、喜欢白天。\n年轻时：容易被别人的方向带着走，走着走着忘了自己原本想去哪。\n经历半生：明白有方向的人，走慢一点也不怕。","向光不是盲目乐观，也不是看不见阴影。","写下你希望三年后的自己是什么样子，贴在看得见的地方，每周看一次。","向光不是假装世界没有黑暗，而是决定自己朝着有光的那一边走。"]},{"id":49,"name":"自救","chapter":"第三章  生命的力量","layers":["没人来的时候，先自己站一下。","小时候：以为自救就是自己爬起来，不哭。\n年轻时：容易等着有人来理解、来拉一把。\n经历半生：懂了能先安顿自己的人，才有力气接受别人的帮助。","自救不是逞强，也不是拒绝求助。","情绪最差的时候，先做三件小事：喝水、洗脸、走出去晒五分钟太阳。","自救不是一个人扛下所有，而是先让自己站稳，再伸手求援。"]},{"id":50,"name":"独立","chapter":"第三章  生命的力量","layers":["能够自己判断，也敢于寻求帮助。","小时候：觉得它意味着“什么都不怕、什么都能做到”。\n年轻时：常把它和咬牙硬撑、不肯认输联系起来。\n经历半生：再看“独立”，才更懂得——能够自己判断，也敢于寻求帮助。","独立不是孤立，而是有判断也有连接。","重要决定先形成自己的判断，再听取不同意见。","真正的独立，不是一句说出口的道理，而是每天愿意践行的选择。能够自己判断，也敢于寻求帮助。"]},{"id":51,"name":"奋勇","chapter":"第三章  生命的力量","layers":["该往前冲的时候，不给自己找理由。","小时候：以为奋勇就是敢打架、敢顶撞。\n年轻时：容易在关键时刻退缩，事后又懊悔。\n经历半生：明白人生真正需要奋勇的时刻不多，但错过一次会记很久。","奋勇不是莽撞，也不是不计代价。","遇到想做又怕的事，给自己一个五秒规则：数到五就行动，不在五秒内找理由。","奋勇不是没有恐惧，而是恐惧还在，脚已经迈出去了。"]},{"id":52,"name":"担当","chapter":"第三章  生命的力量","layers":["承担自己应负的责任而不揽下一切。","小时候：觉得它意味着“什么都不怕、什么都能做到”。\n年轻时：常把它和咬牙硬撑、不肯认输联系起来。\n经历半生：再看“担当”，才更懂得——承担自己应负的责任而不揽下一切。","担当不是把所有人的问题都背在身上。","对自己的决策负责，同时按职责把执行交还负责人。","真正的担当，不是一句说出口的道理，而是每天愿意践行的选择。承担自己应负的责任而不揽下一切。"]},{"id":53,"name":"复原力","chapter":"第三章  生命的力量","layers":["摔倒之后，能回到原来的自己。","小时候：以为复原就是哭完就没事了。\n年轻时：容易以为自己坚强就不会受伤。\n经历半生：明白真正有力气的不是不受伤，而是受伤后能慢慢长回来。","复原力不是遗忘，也不是装作没发生过。","经历一次挫折后，写三行：失去了什么、还剩什么、下一步做什么。","复原力不是回到从前的样子，而是带着伤处，仍能继续往前走。"]},{"id":54,"name":"创造","chapter":"第三章  生命的力量","layers":["从无到有，是最像人的一件事。","小时候：以为创造就是画画、做手工。\n年轻时：容易觉得创造是少数人的事，自己只是执行者。\n经历半生：明白把一件事做成别人没做过的样子，就是创造。","创造不是天赋，也不是必须有惊人的成果。","每月改进一件工作中的小事，哪怕只是把流程缩短一步，记下来。","创造不是凭空而来，而是把已有的东西，重新组合成自己的样子。"]},{"id":55,"name":"韧性","chapter":"第三章  生命的力量","layers":["允许低谷存在，并逐步恢复生命力。","小时候：觉得它意味着“什么都不怕、什么都能做到”。\n年轻时：常把它和咬牙硬撑、不肯认输联系起来。\n经历半生：再看“韧性”，才更懂得——允许低谷存在，并逐步恢复生命力。","韧性不是硬撑到底，也包括及时调整和休息。","给情绪低谷留恢复期，不以一时状态给自己贴标签。","真正的韧性，不是一句说出口的道理，而是每天愿意践行的选择。允许低谷存在，并逐步恢复生命力。"]},{"id":56,"name":"耐心","chapter":"第三章  生命的力量","layers":["尊重成长、恢复和改变所需的时间。","小时候：觉得它意味着“什么都不怕、什么都能做到”。\n年轻时：常把它和咬牙硬撑、不肯认输联系起来。\n经历半生：再看“耐心”，才更懂得——尊重成长、恢复和改变所需的时间。","耐心不是被动等待，而是让准备与时机并行。","等待审批时提前准备可用材料，而不是用着急代替行动。","真正的耐心，不是一句说出口的道理，而是每天愿意践行的选择。尊重成长、恢复和改变所需的时间。"]},{"id":57,"name":"蓬勃","chapter":"第三章  生命的力量","layers":["该长的时候，就用力长。","小时候：以为蓬勃就是枝繁叶茂、热热闹闹。\n年轻时：容易压抑自己的势头，怕太显眼、怕被议论。\n经历半生：明白年轻时不敢长，后来想长也长不动了。","蓬勃不是张扬，也不是不顾他人。","遇到让你兴奋的机会，先说一句「我想试试」，把犹豫放到试过之后。","蓬勃不是永远向上，而是有机会的时候，不吝惜自己的力气。"]},{"id":58,"name":"魄力","chapter":"第三章  生命的力量","layers":["想清楚了，就别再等一个更好的时机。","小时候：以为魄力就是敢打架、敢顶嘴。\n年轻时：容易被「再等等看」拖住，机会一次次错过。\n经历半生：知道最好的时机往往不存在，只有做和不做。","魄力不是莽撞，也不是不计后果。","给自己定规则：信息到七成就可以决定，剩下三成边做边补。","魄力不是不犹豫，而是犹豫之后，仍然迈出那一步。"]},{"id":59,"name":"沉稳","chapter":"第三章  生命的力量","layers":["复杂时先分辨轻重，再采取行动。","小时候：觉得它意味着“什么都不怕、什么都能做到”。\n年轻时：常把它和咬牙硬撑、不肯认输联系起来。\n经历半生：再看“沉稳”，才更懂得——复杂时先分辨轻重，再采取行动。","沉稳不是迟钝，而是行动前多一分辨别。","重大争议出现时先核实三项事实，再回应。","真正的沉稳，不是一句说出口的道理，而是每天愿意践行的选择。复杂时先分辨轻重，再采取行动。"]},{"id":60,"name":"不服输","chapter":"第三章  生命的力量","layers":["输了这一局，不等于输了这一生。","小时候：以为不服输就是输了还要再打一场。\n年轻时：容易因为一次失败，给自己下很重的结论。\n经历半生：明白真正的不服输，是把这次教训带到下一次。","不服输不是死不认错，也不是跟自己较劲。","失败后写三行：这次哪里做错了、下次改什么、什么时候再来一次。","不服输不是不接受失败，而是不接受「就这样了」。"]},{"id":61,"name":"希望","chapter":"第三章  生命的力量","layers":["不确定结局，仍给未来留一扇窗。","小时候：觉得它意味着“什么都不怕、什么都能做到”。\n年轻时：常把它和咬牙硬撑、不肯认输联系起来。\n经历半生：再看“希望”，才更懂得——不确定结局，仍给未来留一扇窗。","希望不是保证好结果，而是愿意继续创造可能。","把“也许会好”变成一个可执行的小计划。","真正的希望，不是一句说出口的道理，而是每天愿意践行的选择。不确定结局，仍给未来留一扇窗。"]},{"id":62,"name":"底气","chapter":"第三章  生命的力量","layers":["心里有数，说话就不必抬高声音。","小时候：以为底气就是家里有、有人撑。\n年轻时：容易靠外面的认可撑着自己的信心。\n经历半生：明白底气来自一次次把事做成，而不是别人怎么看你。","底气不是傲慢，也不是不虚心。","每完成一件事，记下一条「我做到了什么」，年底翻一次，那就是你的底气。","底气不是因为有靠山，而是知道自己能靠得住。"]},{"id":63,"name":"生命力","chapter":"第三章  生命的力量","layers":["只要还愿意长，就还没输。","小时候：以为生命力就是身体好、不生病。\n年轻时：容易把体力当成全部，透支着用。\n经历半生：明白生命力更多是心气，是遇到难处还想往前走的劲。","生命力不是永动机，也不是不许休息。","感觉撑不住的时候，先睡够一晚、吃一顿好饭，很多事第二天再看会不一样。","生命力不是不会倒下，而是倒下去以后，还愿意自己爬起来。"]},{"id":64,"name":"闯劲","chapter":"第三章  生命的力量","layers":["没走过的路，也敢去踩一脚。","小时候：以为闯劲就是天不怕地不怕。\n年轻时：容易在稳妥和冒险之间，永远选稳妥。\n经历半生：明白人生最后悔的，往往是想做而没做的那件事。","闯劲不是莽撞，也不是不顾后果。","每年做一件「没做过」的事，不必大，比如学一样新技能、去一个陌生的城市。","闯劲不是不怕，而是怕过之后，还是想去看看。"]},{"id":65,"name":"期许","chapter":"第三章  生命的力量","layers":["心里有盼头，脚下才有路。","小时候：以为期许就是等过年、等放假。\n年轻时：容易把期待全放在别人身上，别人不做就失落。\n经历半生：明白给自己定一个盼头的人，日子才过得有滋味。","期许不是空想，也不是把希望寄托在别人身上。","给自己定一件三个月后会发生的好事，提前准备，认真期待。","期许不是等好事降临，而是先为它腾出位置。"]},{"id":66,"name":"心气","chapter":"第三章  生命的力量","layers":["不服气，也是一种力气。","小时候：以为心气就是脾气大、爱较真。\n年轻时：容易被生活磨掉锐气，慢慢什么都懒得争。\n经历半生：明白人一旦没了心气，日子就只剩下熬。","心气不是争强好胜，也不是处处不服。","找出最想改变的一件事，为它设定一个可见的进度，每周推进一点。","心气不是不肯低头，而是知道自己还想去更高一点的地方。"]},{"id":67,"name":"跃跃欲试","chapter":"第三章  生命的力量","layers":["手痒，是好事。","小时候：以为跃跃欲试就是坐不住、爱表现。\n年轻时：容易把心里的冲动压下去，怕做不好被人笑。\n经历半生：明白让人后悔的从来不是做砸了，而是没试。","跃跃欲试不是轻率，也不是盲目自信。","想试一件事，先做一个最小版本：用一天时间做出个粗糙的样子，先给自己看。","跃跃欲试不是心浮气躁，而是心里还住着一个愿意试的人。"]},{"id":68,"name":"自由","chapter":"第四章  自由与自我","layers":["有选择的能力，也有面对不能选择之事的胸怀。","小时候：以为自由就是没人管，想去哪里就去哪里。\n年轻时：以为有足够的钱和时间，就能获得自由。\n经历半生：逐渐明白还需要不被恐惧、愧疚与执念困住。","误区：自由不是不承担责任，也不是永远能让事情如愿。","生活修炼：建立能离开自己运转的工作系统，也练习休息时不自责。","金句：真正的自由，不只是拥有选择的权利，也是在不能选择时仍保持内心宽阔。"]},{"id":69,"name":"自主","chapter":"第四章  自由与自我","layers":["把人生重要决定重新握在自己手里。","小时候：觉得它就是“我想做什么就做什么”。\n年轻时：为了获得独立和认可，容易把不断努力当成自由的前提。\n经历半生：再看“自主”，才更懂得——把人生重要决定重新握在自己手里。","自主不是从此无需商量，而是有意识地参与决定。","每周留一段完全由自己决定用途的时间。","真正的自主，不是一句说出口的道理，而是每天愿意践行的选择。把人生重要决定重新握在自己手里。"]},{"id":70,"name":"本心","chapter":"第四章  自由与自我","layers":["走远了，记得回来问一句自己。","小时候：以为本心就是想要什么就要什么。\n年轻时：容易被别人的期待推着走，很久没问过自己。\n经历半生：明白本心是那个在深夜还愿意承认的声音。","本心不是任性，也不是不肯妥协。","每月问自己三个问题：我在忙什么？这是我想要的吗？如果只剩五年，我还会这样做吗？","本心不是不变的答案，而是你愿意一次次回去问的地方。"]},{"id":71,"name":"自洽","chapter":"第四章  自由与自我","layers":["接纳内心的矛盾，不靠伪装获得一致。","小时候：觉得它就是“我想做什么就做什么”。\n年轻时：为了获得独立和认可，容易把不断努力当成自由的前提。\n经历半生：再看“自洽”，才更懂得——接纳内心的矛盾，不靠伪装获得一致。","自洽不是给自己所有行为找借口，而是诚实看见矛盾。","允许自己既喜欢事业又渴望休息，不必逼自己二选一。","真正的自洽，不是一句说出口的道理，而是每天愿意践行的选择。接纳内心的矛盾，不靠伪装获得一致。"]},{"id":72,"name":"自爱","chapter":"第四章  自由与自我","layers":["像照顾重要的人一样照顾自己。","小时候：觉得它就是“我想做什么就做什么”。\n年轻时：为了获得独立和认可，容易把不断努力当成自由的前提。\n经历半生：再看“自爱”，才更懂得——像照顾重要的人一样照顾自己。","自爱不是事事优先自己，而是不再总把自己放最后。","工作再忙也为睡眠、饮食与体检留出优先位置。","真正的自爱，不是一句说出口的道理，而是每天愿意践行的选择。像照顾重要的人一样照顾自己。"]},{"id":73,"name":"不讨好","chapter":"第四章  自由与自我","layers":["不必让所有人都满意。","小时候：以为不讨好就是不懂事、不礼貌。\n年轻时：习惯先看别人的脸色，再决定自己怎么说。\n经历半生：知道能让人人都满意的人，往往把自己弄丢了。","不讨好不是没礼貌，也不是故意让人不舒服。","遇到不情愿的请求，练习说一句：「这次我可能帮不上」，不必解释三条理由。","不讨好不是冷漠，而是把有限的好，留给真正值得的人。"]},{"id":74,"name":"自尊","chapter":"第四章  自由与自我","layers":["尊重自身价值，不靠外界掌声续命。","小时候：觉得它就是“我想做什么就做什么”。\n年轻时：为了获得独立和认可，容易把不断努力当成自由的前提。\n经历半生：再看“自尊”，才更懂得——尊重自身价值，不靠外界掌声续命。","自尊不是骄傲，而是不因一时得失贬低自己。","一次失败后，用事实描述问题，不用“我不行”评价自己。","真正的自尊，不是一句说出口的道理，而是每天愿意践行的选择。尊重自身价值，不靠外界掌声续命。"]},{"id":75,"name":"自律","chapter":"第四章  自由与自我","layers":["用温和的秩序保护长久的选择权。","小时候：觉得它就是“我想做什么就做什么”。\n年轻时：为了获得独立和认可，容易把不断努力当成自由的前提。\n经历半生：再看“自律”，才更懂得——用温和的秩序保护长久的选择权。","自律不是日程排满，而是让习惯服务于自由。","减少无意义会议，建立固定而可持续的工作节奏。","真正的自律，不是一句说出口的道理，而是每天愿意践行的选择。用温和的秩序保护长久的选择权。"]},{"id":76,"name":"做自己","chapter":"第四章  自由与自我","layers":["不用照着谁的模板过日子。","小时候：以为做自己就是不听劝、想怎样就怎样。\n年轻时：容易把「像某个人」当成目标，追着别人的路径跑。\n经历半生：明白做自己不是拒绝所有建议，而是自己决定听谁的建议。","做自己不是任性妄为，也不是不思改进。","列出三件「别人觉得好但我并不想要」的事，允许自己不做。","做自己不是标新立异，而是不再为了一份不属于自己的期待而活。"]},{"id":77,"name":"真实","chapter":"第四章  自由与自我","layers":["让外在生活逐渐接近内心所信。","小时候：觉得它就是“我想做什么就做什么”。\n年轻时：为了获得独立和认可，容易把不断努力当成自由的前提。\n经历半生：再看“真实”，才更懂得——让外在生活逐渐接近内心所信。","真实不是毫无分寸地表达，而是不背离重要的自己。","面对不想接的任务，清楚而尊重地说出真实想法。","真正的真实，不是一句说出口的道理，而是每天愿意践行的选择。让外在生活逐渐接近内心所信。"]},{"id":78,"name":"独处","chapter":"第四章  自由与自我","layers":["一个人时也能和自己自在相伴。","小时候：觉得它就是“我想做什么就做什么”。\n年轻时：为了获得独立和认可，容易把不断努力当成自由的前提。\n经历半生：再看“独处”，才更懂得——一个人时也能和自己自在相伴。","独处不是孤独的同义词，也不意味着不需要别人。","留一段时间不社交，也不需要用手机填满空白。","真正的独处，不是一句说出口的道理，而是每天愿意践行的选择。一个人时也能和自己自在相伴。"]},{"id":79,"name":"内心秩序","chapter":"第四章  自由与自我","layers":["外面再乱，里面还有一套自己的顺序。","小时候：以为秩序就是把东西收拾整齐。\n年轻时：容易被外面的节奏带着跑，一天下来不知忙了什么。\n经历半生：懂得心里有序的人，日子再乱也不至于散掉。","内心秩序不是刻板，也不是把生活切成格子。","每天早上先定下三件「今天必须完成」的事，其余都是可以往后放的。","内心秩序不是把人生安排得滴水不漏，而是乱的时候还找得到自己的主线。"]},{"id":80,"name":"松弛","chapter":"第四章  自由与自我","layers":["尽责，却不让身体和心始终紧绷。","小时候：觉得它就是“我想做什么就做什么”。\n年轻时：为了获得独立和认可，容易把不断努力当成自由的前提。\n经历半生：再看“松弛”，才更懂得——尽责，却不让身体和心始终紧绷。","松弛不是散漫，而是不让认真变成时时紧绷。","把“必须立刻处理”改为“是否真的需要现在处理”。","真正的松弛，不是一句说出口的道理，而是每天愿意践行的选择。尽责，却不让身体和心始终紧绷。"]},{"id":81,"name":"安全感","chapter":"第四章  自由与自我","layers":["知道不确定存在，也有应对与依靠。","小时候：觉得它就是“我想做什么就做什么”。\n年轻时：为了获得独立和认可，容易把不断努力当成自由的前提。\n经历半生：再看“安全感”，才更懂得——知道不确定存在，也有应对与依靠。","安全感不是百分百确定，而是资源、关系与应对能力的结合。","区分生活储备与事业风险资金，知道自己的底线。","真正的安全感，不是一句说出口的道理，而是每天愿意践行的选择。知道不确定存在，也有应对与依靠。"]},{"id":82,"name":"边界感","chapter":"第四章  自由与自我","layers":["亲近，也留一条线。","小时候：以为边界就是不许别人碰我的东西。\n年轻时：容易把「不分彼此」当成亲密，把边界当成疏远。\n经历半生：明白好的关系，是彼此都清楚哪条线不必越过。","边界感不是筑墙，也不是冷漠。","遇到让人不舒服的提问，可以先说「这个我暂时不想聊」，不必编理由。","边界感不是把人推开，而是让关系有可以长久呼吸的空间。"]},{"id":83,"name":"觉察","chapter":"第四章  自由与自我","layers":["及时看见自己的念头、情绪与反应。","小时候：觉得它就是“我想做什么就做什么”。\n年轻时：为了获得独立和认可，容易把不断努力当成自由的前提。\n经历半生：再看“觉察”，才更懂得——及时看见自己的念头、情绪与反应。","觉察不是监视自己，而是温和地看见发生了什么。","焦虑来时先给情绪命名，而不是立刻行动。","真正的觉察，不是一句说出口的道理，而是每天愿意践行的选择。及时看见自己的念头、情绪与反应。"]},{"id":84,"name":"觉醒","chapter":"第四章  自由与自我","layers":["开始问自己真正愿意怎样活。","小时候：觉得它就是“我想做什么就做什么”。\n年轻时：为了获得独立和认可，容易把不断努力当成自由的前提。\n经历半生：再看“觉醒”，才更懂得——开始问自己真正愿意怎样活。","觉醒不是突然知道全部答案，而是敢于重新提问。","写下“如果无需证明自己，我会怎样过一天？”","真正的觉醒，不是一句说出口的道理，而是每天愿意践行的选择。开始问自己真正愿意怎样活。"]},{"id":85,"name":"不焦虑","chapter":"第四章  自由与自我","layers":["把担心的事，换成可做的一步。","小时候：以为不焦虑就是什么都不担心。\n年轻时：容易为还没发生的事反复设想最坏的结果。\n经历半生：发现焦虑大多不是因为难，而是因为不知道从哪开始。","不焦虑不是没有压力，也不是放弃准备。","焦虑时写下最担心的那一件事，再写一个今天能做的最小动作，去做它。","不焦虑不是心里没有风浪，而是知道风浪来了，自己有一条船。"]},{"id":86,"name":"慈悲","chapter":"第五章  爱与关系","layers":["理解痛苦而不制造更多痛苦。","小时候：以为它就是“对别人好、不要吵架”。\n年轻时：容易用付出和承担来维系关系，希望每个人都满意。\n经历半生：再看“慈悲”，才更懂得——理解痛苦而不制造更多痛苦。","慈悲不是无条件承担他人的痛苦。","对别人的困难保有理解，也问自己能负担多少。","真正的慈悲，不是一句说出口的道理，而是每天愿意践行的选择。理解痛苦而不制造更多痛苦。"]},{"id":87,"name":"善良","chapter":"第五章  爱与关系","layers":["愿意照顾他人，也不忽略自己。","小时候：以为它就是“对别人好、不要吵架”。\n年轻时：容易用付出和承担来维系关系，希望每个人都满意。\n经历半生：再看“善良”，才更懂得——愿意照顾他人，也不忽略自己。","善良不是没有原则的退让。","帮助人时先看对方真正需要什么，而不是只给自己想给的。","真正的善良，不是一句说出口的道理，而是每天愿意践行的选择。愿意照顾他人，也不忽略自己。"]},{"id":88,"name":"温柔以待","chapter":"第五章  爱与关系","layers":["对这个世界，好好说话。","小时候：以为温柔就是说话小声、不吵架。\n年轻时：容易把温柔当成软弱，觉得要硬一点才不吃亏。\n经历半生：明白能对人温柔的人，往往是最有底气的。","温柔以待不是委屈自己，也不是没有底线。","今天对三个人说一句善意的话，包括一个陌生人，比如对服务员说声谢谢。","温柔以待不是讨好世界，而是选择不把世界变得更好斗。"]},{"id":89,"name":"倾听","chapter":"第五章  爱与关系","layers":["先听完，再说话。","小时候：以为听话就是不出声。\n年轻时：容易一边听一边准备反驳，话还没听完，心里已经有了答案。\n经历半生：明白人最需要的常常不是办法，是被听见。","倾听不是沉默不语，也不是什么都答应。","和人说话时，忍住不给建议，先重复一句「你的意思是……对吗？」","倾听不是等着轮到自己说，而是真的想知道对方心里发生了什么。"]},{"id":90,"name":"宽容","chapter":"第五章  爱与关系","layers":["承认别人和自己都有限度。","小时候：以为它就是“对别人好、不要吵架”。\n年轻时：容易用付出和承担来维系关系，希望每个人都满意。\n经历半生：再看“宽容”，才更懂得——承认别人和自己都有限度。","宽容不是纵容伤害。","接受一个人的失误，但必要时仍设清楚的规则。","真正的宽容，不是一句说出口的道理，而是每天愿意践行的选择。承认别人和自己都有限度。"]},{"id":91,"name":"暖阳","chapter":"第五章  爱与关系","layers":["做别人的太阳，先别把自己烧尽。","小时候：以为暖阳就是冬天的太阳，晒着舒服。\n年轻时：容易为了照亮别人，把自己耗空。\n经历半生：明白能长久温暖别人的人，先懂得照顾自己。","暖阳不是燃烧自己，也不是无底线付出。","在答应对别人的帮助前，先确认自己有没有余力，没有就诚实说。","暖阳不是永远发光，而是休息好了，明天还能照过来。"]},{"id":92,"name":"理解","chapter":"第五章  爱与关系","layers":["暂时放下评判，试着走进另一种处境。","小时候：以为它就是“对别人好、不要吵架”。\n年轻时：容易用付出和承担来维系关系，希望每个人都满意。\n经历半生：再看“理解”，才更懂得——暂时放下评判，试着走进另一种处境。","理解不必等于赞同。","先完整听对方讲完，再给出自己的判断。","真正的理解，不是一句说出口的道理，而是每天愿意践行的选择。暂时放下评判，试着走进另一种处境。"]},{"id":93,"name":"不评判","chapter":"第五章  爱与关系","layers":["先说「我听见了」，再谈对错。","小时候：以为不评判就是不说好不说坏。\n年轻时：习惯一眼给人下结论：「他就是这种人」。\n经历半生：知道每个人背后都有一段自己没看见的路。","不评判不是没有是非，也不是什么都可以。","听到与自己不同的选择，先问一句「当时是什么情况」，再决定怎么回应。","不评判不是放弃判断力，而是先给人留出解释的机会。"]},{"id":94,"name":"挂念","chapter":"第五章  爱与关系","layers":["有人想着你，是最实在的福气。","小时候：以为挂念就是妈妈叮嘱你多穿衣服。\n年轻时：容易觉得被挂念是一种管束，急着挣脱。\n经历半生：明白这世上愿意惦记你的人，其实没几个。","挂念不是控制，也不是时时要求回应。","想起一个人就发条消息，只说一句「突然想起你，你还好吗」，不等回复。","挂念不是负担，而是证明你在这世上被人放在心里过。"]},{"id":95,"name":"尊重","chapter":"第五章  爱与关系","layers":["承认别人有不同于我的生活权利。","小时候：以为它就是“对别人好、不要吵架”。\n年轻时：容易用付出和承担来维系关系，希望每个人都满意。\n经历半生：再看“尊重”，才更懂得——承认别人有不同于我的生活权利。","尊重不要求每个人想法一致。","允许家人拥有与你不同的生活节奏。","真正的尊重，不是一句说出口的道理，而是每天愿意践行的选择。承认别人有不同于我的生活权利。"]},{"id":96,"name":"包容","chapter":"第五章  爱与关系","layers":["给关系里的不同和不完美留空间。","小时候：以为它就是“对别人好、不要吵架”。\n年轻时：容易用付出和承担来维系关系，希望每个人都满意。\n经历半生：再看“包容”，才更懂得——给关系里的不同和不完美留空间。","包容不是取消自己的需要。","遇到分歧，先找共同重视的东西。","真正的包容，不是一句说出口的道理，而是每天愿意践行的选择。给关系里的不同和不完美留空间。"]},{"id":97,"name":"共情","chapter":"第五章  爱与关系","layers":["先站在他的位置上，看一眼。","小时候：以为共情就是跟着别人一起哭。\n年轻时：容易急着给建议，觉得帮上忙才叫关心。\n经历半生：明白多数时候，人需要的只是有人懂。","共情不是赞同一切，也不是替人做决定。","听到别人诉苦，先不给建议，只说一句「这确实很难」，让对方接着说。","共情不是和他一起沉下去，而是让他知道，有人在旁边陪着。"]},{"id":98,"name":"分寸感","chapter":"第五章  爱与关系","layers":["知道什么该问，什么不该问。","小时候：以为分寸就是客客气气、讲礼貌。\n年轻时：容易把「我是为你好」当成越界的通行证。\n经历半生：明白真正的关心，往往止步于对方愿意说的地方。","分寸感不是疏远，也不是小心翼翼。","话到一半先停一秒，问自己：这句是对方需要的，还是我自己想说的？","分寸感不是隔着一层，而是懂得在对的地方停住。"]},{"id":99,"name":"真诚","chapter":"第五章  爱与关系","layers":["让表达与内心尽可能一致。","小时候：以为它就是“对别人好、不要吵架”。\n年轻时：容易用付出和承担来维系关系，希望每个人都满意。\n经历半生：再看“真诚”，才更懂得——让表达与内心尽可能一致。","真诚不是把所有感受都毫无修饰地抛给别人。","以温和而明确的话表达感谢、拒绝或担忧。","真正的真诚，不是一句说出口的道理，而是每天愿意践行的选择。让表达与内心尽可能一致。"]},{"id":100,"name":"珍视","chapter":"第五章  爱与关系","layers":["重要的东西，要好好放着。","小时候：以为珍视就是不给别人碰自己的宝贝。\n年轻时：容易把身边的人当成永远都在，话越说越随便。\n经历半生：明白能在一段关系里被珍视，是很少见的事。","珍视不是占为己有，也不是患得患失。","每个月认真做一件让对方感受到「你很重要」的事，不必是大事。","珍视不是害怕失去，而是拥有的时候真的用心。"]},{"id":101,"name":"信任","chapter":"第五章  爱与关系","layers":["给别人承担责任与成长的机会。","小时候：以为它就是“对别人好、不要吵架”。\n年轻时：容易用付出和承担来维系关系，希望每个人都满意。\n经历半生：再看“信任”，才更懂得——给别人承担责任与成长的机会。","信任不是放弃必要的边界和核查。","把一项工作授权给负责人，并约定检查节点而非时时插手。","真正的信任，不是一句说出口的道理，而是每天愿意践行的选择。给别人承担责任与成长的机会。"]},{"id":102,"name":"不纠缠","chapter":"第五章  爱与关系","layers":["该收的场，好好收。","小时候：以为不纠缠就是吵完架不理人。\n年轻时：容易在已经结束的关系里反复追问「为什么」。\n经历半生：知道有些答案，问不到也不必再问。","不纠缠不是冷漠，也不是假装不在意。","给一段已经过去的情绪定一个告别的仪式：写一封信，不寄出，然后收起来。","不纠缠不是把人忘掉，而是不再用自己的余生，换一个已经过期的答案。"]},{"id":103,"name":"真情","chapter":"第五章  爱与关系","layers":["不用演，也值得被喜欢。","小时候：以为真情就是哭得很大声、说得很好听。\n年轻时：容易在关系里戴上合适的面具，慢慢忘了自己本来的样子。\n经历半生：明白能被人喜欢真实的你，是极少数，也是极珍贵。","真情不是毫无保留，也不是不加分寸。","对最亲近的人，试着说一次真实的想法，哪怕不太好听。","真情不是把自己全部摊开，而是不为了被喜欢而假装。"]},{"id":104,"name":"陪伴","chapter":"第五章  爱与关系","layers":["把真正的时间交给眼前的人。","小时候：以为它就是“对别人好、不要吵架”。\n年轻时：容易用付出和承担来维系关系，希望每个人都满意。\n经历半生：再看“陪伴”，才更懂得——把真正的时间交给眼前的人。","陪伴不只是待在同一屋檐下。","和父母相处时暂时不看工作消息。","真正的陪伴，不是一句说出口的道理，而是每天愿意践行的选择。把真正的时间交给眼前的人。"]},{"id":105,"name":"感恩","chapter":"第五章  爱与关系","layers":["看见生命中并非理所当然的馈赠。","小时候：以为它就是“对别人好、不要吵架”。\n年轻时：容易用付出和承担来维系关系，希望每个人都满意。\n经历半生：再看“感恩”，才更懂得——看见生命中并非理所当然的馈赠。","感恩不是否认自己受过的苦。","每天记下一件并非理所当然的小事。","真正的感恩，不是一句说出口的道理，而是每天愿意践行的选择。看见生命中并非理所当然的馈赠。"]},{"id":106,"name":"和美","chapter":"第五章  爱与关系","layers":["和和气气，也是一种福。","小时候：以为和美就是家里不吵架。\n年轻时：容易把和气当成没有原则，觉得该争的要争。\n经历半生：明白能好好相处的人，日子会顺很多。","和美不是一味忍让，也不是假装没问题。","家里有分歧时，先说一句「我理解你的想法」，再讲自己的。","和美不是没有矛盾，而是有了矛盾还能坐下来吃饭。"]},{"id":107,"name":"照见","chapter":"第五章  爱与关系","layers":["关系是一面镜子，照出自己也照见他人。","小时候：以为相处就是一起玩、一起笑。\n年轻时：容易在关系里只盯着对方哪里不对。\n经历半生：明白你在别人身上最受不了的东西，往往自己身上也有。","照见不是自我责备，也不是什么都往自己身上揽。","对一个人莫名反感时，写下他的三个特点，看看哪一条自己也有。","照见不是挑剔别人，而是借别人的样子，看清自己的轮廓。"]},{"id":108,"name":"体谅","chapter":"第五章  爱与关系","layers":["留意别人尚未说出口的难处。","小时候：以为它就是“对别人好、不要吵架”。\n年轻时：容易用付出和承担来维系关系，希望每个人都满意。\n经历半生：再看“体谅”，才更懂得——留意别人尚未说出口的难处。","体谅不是要求自己永远忍耐。","在评价对方之前，先想想其可能承担的压力。","真正的体谅，不是一句说出口的道理，而是每天愿意践行的选择。留意别人尚未说出口的难处。"]},{"id":109,"name":"成全","chapter":"第五章  爱与关系","layers":["希望对方好，也允许其选择不同的路。","小时候：以为它就是“对别人好、不要吵架”。\n年轻时：容易用付出和承担来维系关系，希望每个人都满意。\n经历半生：再看“成全”，才更懂得——希望对方好，也允许其选择不同的路。","成全不是牺牲自己以换取认可。","支持亲近的人作出属于他们自己的选择。","真正的成全，不是一句说出口的道理，而是每天愿意践行的选择。希望对方好，也允许其选择不同的路。"]},{"id":110,"name":"不失礼","chapter":"第五章  爱与关系","layers":["缘尽时，仍留一份体面。","小时候：以为不失礼就是见面打招呼。\n年轻时：容易在分开时把话说尽，把气都出完。\n经历半生：知道体面不是留给别人看的，是留给以后自己的。","不失礼不是虚伪，也不是压抑所有情绪。","说再见的时候，把最难听的那句留在心里，说出口的只留一句「谢谢你」。","不失礼不是没有情绪，而是不让情绪替你把门彻底关死。"]},{"id":111,"name":"幸福","chapter":"第六章  幸福与生活","layers":["过一种自己认可且能够持续的生活。","小时候：觉得它来自好吃的、好玩的和被夸奖的时刻。\n年轻时：常把它寄托在目标达成、事业进步或更好的生活条件上。\n经历半生：再看“幸福”，才更懂得——过一种自己认可且能够持续的生活。","幸福不是持续兴奋，也没有唯一的社会模板。","描绘一个普通而满意的周二，而不只描绘人生巅峰。","真正的幸福，不是一句说出口的道理，而是每天愿意践行的选择。过一种自己认可且能够持续的生活。"]},{"id":112,"name":"快乐","chapter":"第六章  幸福与生活","layers":["允许简单的好事照亮此刻。","小时候：觉得它来自好吃的、好玩的和被夸奖的时刻。\n年轻时：常把它寄托在目标达成、事业进步或更好的生活条件上。\n经历半生：再看“快乐”，才更懂得——允许简单的好事照亮此刻。","快乐不必靠巨大成就才能正当存在。","允许自己因一顿好饭或一次散步而开心。","真正的快乐，不是一句说出口的道理，而是每天愿意践行的选择。允许简单的好事照亮此刻。"]},{"id":113,"name":"感恩当下","chapter":"第六章  幸福与生活","layers":["此刻拥有的，已经不少。","小时候：以为感恩就是过节时说谢谢。\n年轻时：容易把眼光放在还没得到的上面，眼前的总觉得不够。\n经历半生：明白能够平静地过完一天，本身就是很多人求不到的福气。","感恩当下不是不求上进，也不是自我安慰。","每天睡前想一件「今天发生了真好」的小事，不用写下来，在心里过一遍。","感恩当下不是停在原地，而是先把脚下这一步走稳。"]},{"id":114,"name":"慢生活","chapter":"第六章  幸福与生活","layers":["把速度调慢半档，日子会变厚。","小时候：以为慢就是磨蹭、不勤快。\n年轻时：习惯用效率衡量一切，连吃饭和休息都要算时间。\n经历半生：发现很多好味道、好意头，都是在放慢的时候才尝到的。","慢生活不是懒散，也不是逃避责任。","一周挑一顿饭，不看手机，只吃饭，吃完再起身。","慢生活不是把事往后拖，而是把心放在正在做的这一件事上。"]},{"id":115,"name":"喜悦","chapter":"第六章  幸福与生活","layers":["从心底感到生命值得参与。","小时候：觉得它来自好吃的、好玩的和被夸奖的时刻。\n年轻时：常把它寄托在目标达成、事业进步或更好的生活条件上。\n经历半生：再看“喜悦”，才更懂得——从心底感到生命值得参与。","喜悦可以平凡，不必轰轰烈烈。","停下来感受一个小小的好结果，不急着奔向下一项任务。","真正的喜悦，不是一句说出口的道理，而是每天愿意践行的选择。从心底感到生命值得参与。"]},{"id":116,"name":"被需要","chapter":"第六章  幸福与生活","layers":["有人需要你，日子就有了重量。","小时候：以为被需要就是别人离不开自己。\n年轻时：容易为了被需要而过度付出，最后累到怨。\n经历半生：明白能被人安心地依靠，是一种运气，也是一种能力。","被需要不是被消耗，也不是要靠付出来换位置。","主动为一个人做一件他真正需要的小事，不问回报，也不提。","被需要不是要成为别人的全部，而是在他需要的时候，你恰好还在。"]},{"id":117,"name":"满足","chapter":"第六章  幸福与生活","layers":["承认此刻已经拥有的部分。","小时候：觉得它来自好吃的、好玩的和被夸奖的时刻。\n年轻时：常把它寄托在目标达成、事业进步或更好的生活条件上。\n经历半生：再看“满足”，才更懂得——承认此刻已经拥有的部分。","满足不等于放弃改善生活。","每完成一件事，先确认已拥有的成果，再开启下一个目标。","真正的满足，不是一句说出口的道理，而是每天愿意践行的选择。承认此刻已经拥有的部分。"]},{"id":118,"name":"日常","chapter":"第六章  幸福与生活","layers":["值得过的日子，大多是没什么大事的日子。","小时候：以为日常生活就是上学、写作业、等放假。\n年轻时：容易把日常当成过渡，总觉得好日子在以后。\n经历半生：明白人生的大部分，就是这些不起眼的日常。","珍惜日常不是没有抱负，也不是安于平庸。","每天记一句「今天发生的小好事」，比如阳光很好、饭很好吃。","日常不是等待大事发生的间隙，它本身就是人生。"]},{"id":119,"name":"有所热爱","chapter":"第六章  幸福与生活","layers":["有一件事，不为钱也愿意做。","小时候：以为热爱就是喜欢玩。\n年轻时：容易把爱好当成不务正业，一件件放下。\n经历半生：明白那些能让人忘记时间的事，最后成了撑住人的东西。","热爱不是逃避责任，也不是非得做出成绩。","把一件喜欢的事固定放进每周日程，像开会一样对待它，不要总被别的事挤掉。","热爱不是热闹的追求，而是在没人看见的时候，你还愿意去做。"]},{"id":120,"name":"充实","chapter":"第六章  幸福与生活","layers":["时间里有与自己价值相符的内容。","小时候：觉得它来自好吃的、好玩的和被夸奖的时刻。\n年轻时：常把它寄托在目标达成、事业进步或更好的生活条件上。\n经历半生：再看“充实”，才更懂得——时间里有与自己价值相符的内容。","充实不等于忙碌。","检查今天有没有时间留给真正认同的事。","真正的充实，不是一句说出口的道理，而是每天愿意践行的选择。时间里有与自己价值相符的内容。"]},{"id":121,"name":"简单","chapter":"第六章  幸福与生活","layers":["减去多余的复杂，保留真正重要的。","小时候：觉得它来自好吃的、好玩的和被夸奖的时刻。\n年轻时：常把它寄托在目标达成、事业进步或更好的生活条件上。\n经历半生：再看“简单”，才更懂得——减去多余的复杂，保留真正重要的。","简单不是贫乏，而是去掉多余。","删掉一个不再必要的承诺或物品。","真正的简单，不是一句说出口的道理，而是每天愿意践行的选择。减去多余的复杂，保留真正重要的。"]},{"id":122,"name":"暖意","chapter":"第六章  幸福与生活","layers":["有一点温度，就不算冷。","小时候：以为暖意就是冬天的手炉、热汤。\n年轻时：容易忙着往前赶，忽略了身边那些小的温暖。\n经历半生：明白人撑得住，往往靠的就是这些不起眼的暖。","暖意不是刻意示好，也不是讨好。","收到别人的好意时，认真回一句「谢谢你」，不要敷衍。","暖意不是大火，而是冷了的时候，刚好有一杯热水。"]},{"id":123,"name":"小确幸","chapter":"第六章  幸福与生活","layers":["不必等大喜事，才允许自己高兴。","小时候：以为开心要有个大理由，比如过年、生日。\n年轻时：容易把快乐押在远处的目标上，达标之前的每一天都不算数。\n经历半生：知道能天天让人撑住的，往往是小得可怜的那点甜。","小确幸不是自我安慰，也不是逃避现实。","给自己留一个「十分钟清单」：泡杯茶、翻两页书、晒会儿太阳，情绪低时就去做一条。","小确幸不是人生的全部，但它是让人撑过人生的那点力气。"]},{"id":124,"name":"纯粹","chapter":"第六章  幸福与生活","layers":["行动尽量靠近初心，而不被杂音裹挟。","小时候：觉得它来自好吃的、好玩的和被夸奖的时刻。\n年轻时：常把它寄托在目标达成、事业进步或更好的生活条件上。\n经历半生：再看“纯粹”，才更懂得——行动尽量靠近初心，而不被杂音裹挟。","纯粹不是对现实一无所知。","问自己“如果没有掌声，我还愿意做这件事吗？”","真正的纯粹，不是一句说出口的道理，而是每天愿意践行的选择。行动尽量靠近初心，而不被杂音裹挟。"]},{"id":125,"name":"安稳","chapter":"第六章  幸福与生活","layers":["不必天天惊心动魄。","小时候：以为安稳就是没有变化、永远一样。\n年轻时：容易觉得安稳是平庸，追求刺激才叫活过。\n经历半生：明白能安稳过日子的人，是修来的福。","安稳不是没有追求，也不是不敢动。","把生活的底盘做稳：规律作息、留出应急钱、维护两三段真实的关系。","安稳不是停在原地不动，而是有一个可以回去的地方。"]},{"id":126,"name":"悠然","chapter":"第六章  幸福与生活","layers":["不把每一分钟都当成待完成任务。","小时候：觉得它来自好吃的、好玩的和被夸奖的时刻。\n年轻时：常把它寄托在目标达成、事业进步或更好的生活条件上。\n经历半生：再看“悠然”，才更懂得——不把每一分钟都当成待完成任务。","悠然不是拖延，而是允许生活有空白。","周末留一段不排计划的时间。","真正的悠然，不是一句说出口的道理，而是每天愿意践行的选择。不把每一分钟都当成待完成任务。"]},{"id":127,"name":"烟火气","chapter":"第六章  幸福与生活","layers":["有点人声，有点饭香。","小时候：以为烟火气就是过年放炮、街边小吃。\n年轻时：容易觉得这些都俗，只想要干净漂亮的生活。\n经历半生：才发现最让人安心的，是有人在家等你吃饭的那盏灯。","烟火气不是粗糙，也不是不讲究。","每周做一次饭，不管是给自己还是给家人，尽量不点外卖。","烟火气不是生活的低配版本，而是生活最本来的样子。"]},{"id":128,"name":"好日子","chapter":"第六章  幸福与生活","layers":["不必等，今天就可以是好日子。","小时候：以为好日子就是过年、吃好吃的。\n年轻时：容易把好日子寄在别人的评价里，事事要好才叫好。\n经历半生：明白好日子就是睡得好、吃得下、有人说话。","好日子不是事事如意，也不是没有烦恼。","今天给自己安排一件「小而确定的好事」，比如一杯喜欢的咖啡、一次散步。","好日子不是等来的，是一天一天过出来的。"]},{"id":129,"name":"闲适","chapter":"第六章  幸福与生活","layers":["享受不需要证明效率的时光。","小时候：觉得它来自好吃的、好玩的和被夸奖的时刻。\n年轻时：常把它寄托在目标达成、事业进步或更好的生活条件上。\n经历半生：再看“闲适”，才更懂得——享受不需要证明效率的时光。","闲适不等于虚度光阴。","允许一个下午只看书、喝茶，不把它记成低效。","真正的闲适，不是一句说出口的道理，而是每天愿意践行的选择。享受不需要证明效率的时光。"]},{"id":130,"name":"惬意","chapter":"第六章  幸福与生活","layers":["让身体与心在当下都感觉合宜。","小时候：觉得它来自好吃的、好玩的和被夸奖的时刻。\n年轻时：常把它寄托在目标达成、事业进步或更好的生活条件上。\n经历半生：再看“惬意”，才更懂得——让身体与心在当下都感觉合宜。","惬意不是时时舒适，而是找到适合自己的节奏。","根据体力调整旅行节奏，而不是追求打卡数量。","真正的惬意，不是一句说出口的道理，而是每天愿意践行的选择。让身体与心在当下都感觉合宜。"]},{"id":131,"name":"心满意足","chapter":"第六章  幸福与生活","layers":["够了，是很高的境界。","小时候：以为心满意足就是吃饱了、玩够了。\n年轻时：容易一直在追下一个目标，很少停下来觉得「这样很好」。\n经历半生：明白能说出「够了」的人，才真正自由。","心满意足不是不上进，也不是放弃追求。","完成一件事后，主动给自己一句：「这件事做得不错」，不马上挑毛病。","心满意足不是终点，而是走了一段路之后，愿意承认自己走得挺好。"]},{"id":132,"name":"松弛感","chapter":"第六章  幸福与生活","layers":["不必绷着，事情也过得去。","小时候：以为松弛就是懒懒散散、不上心。\n年轻时：习惯时刻绷着，怕一放松就落后。\n经历半生：明白绷得太紧的人，往往最先断掉。","松弛不是不在乎，也不是放弃要求。","每天找一个时刻，允许自己什么都不做，就坐着，不刷手机。","松弛不是不上进，而是知道自己尽力了，就允许结果自然发生。"]},{"id":133,"name":"热爱","chapter":"第六章  幸福与生活","layers":["即使明白无常，仍愿意投入生活。","小时候：觉得它来自好吃的、好玩的和被夸奖的时刻。\n年轻时：常把它寄托在目标达成、事业进步或更好的生活条件上。\n经历半生：再看“热爱”，才更懂得——即使明白无常，仍愿意投入生活。","热爱不等于永不疲惫。","每月体验一件新鲜小事，保留对世界的兴趣。","真正的热爱，不是一句说出口的道理，而是每天愿意践行的选择。即使明白无常，仍愿意投入生活。"]},{"id":134,"name":"舒心","chapter":"第六章  幸福与生活","layers":["不拧巴，就是最好的养生。","小时候：以为舒心就是没人管、想干嘛干嘛。\n年轻时：容易把自己绷得太紧，连休息都带着罪恶感。\n经历半生：明白心里不拧巴的人，身体也跟着好。","舒心不是不负责任，也不是懒散。","每天找一段完全不安排的时间，什么都不做，允许自己「就是在浪费时间」。","舒心不是没有压力，而是有压力的时候，还能给自己留一口气。"]},{"id":135,"name":"享受","chapter":"第六章  幸福与生活","layers":["不带亏欠地接住人生给予的美好。","小时候：觉得它来自好吃的、好玩的和被夸奖的时刻。\n年轻时：常把它寄托在目标达成、事业进步或更好的生活条件上。\n经历半生：再看“享受”，才更懂得——不带亏欠地接住人生给予的美好。","享受不是亏欠，更不是必须先完成一切才有的资格。","休息时注意愧疚感出现，但不需要服从它。","真正的享受，不是一句说出口的道理，而是每天愿意践行的选择。不带亏欠地接住人生给予的美好。"]},{"id":136,"name":"惜福","chapter":"第六章  幸福与生活","layers":["拥有的，值得认真对待。","小时候：以为惜福就是不要浪费粮食。\n年轻时：容易觉得眼前的好都是理所当然，眼睛一直看着没得到的。\n经历半生：知道很多福气，失去之后才明白它曾经在。","惜福不是小心翼翼，也不是不敢享受。","每周给一个帮过你的人发一条消息，只说一句：那天谢谢你。","惜福不是怕失去，而是拥有的时候，真的用心拥有过。"]},{"id":137,"name":"欢喜","chapter":"第六章  幸福与生活","layers":["心里装着一点甜。","小时候：以为欢喜就是过年穿新衣、放鞭炮。\n年轻时：容易觉得欢喜要靠大事，小事不算。\n经历半生：明白能在平常日子里笑出声的人，最有福。","欢喜不是天天开心，也不是不许难过。","每天记一句「今天让我笑了一下的事」，一个月后翻看，会很惊讶。","欢喜不是人生没有苦，而是苦里还找得到甜。"]},{"id":138,"name":"珍惜","chapter":"第七章  时间与成长","layers":["不因害怕失去而辜负拥有。","小时候：以为时间很长，成长就是一年比一年懂得更多。\n年轻时：容易用进度和成绩判断自己有没有浪费光阴。\n经历半生：再看“珍惜”，才更懂得——不因害怕失去而辜负拥有。","珍惜不是紧抓不放。","有时间就陪伴想念的人，不把所有团聚都推迟到以后。","真正的珍惜，不是一句说出口的道理，而是每天愿意践行的选择。不因害怕失去而辜负拥有。"]},{"id":139,"name":"当下","chapter":"第七章  时间与成长","layers":["把生命从想象的未来带回眼前。","小时候：以为时间很长，成长就是一年比一年懂得更多。\n年轻时：容易用进度和成绩判断自己有没有浪费光阴。\n经历半生：再看“当下”，才更懂得——把生命从想象的未来带回眼前。","活在当下不是不为未来准备。","焦虑未来时，先问“此刻我正在经历什么？”","真正的当下，不是一句说出口的道理，而是每天愿意践行的选择。把生命从想象的未来带回眼前。"]},{"id":140,"name":"日日新","chapter":"第七章  时间与成长","layers":["今天比昨天好一点，就够了。","小时候：以为进步就是考试分数往上走。\n年轻时：容易想一步登天，做三天没效果就放弃。\n经历半生：明白真正把人拉开距离的，是每天那一点点。","日日新不是每天都要有大变化，也不是不许退步。","给自己定一个每天十分钟的小练习，一年就是六十小时，别小看。","日日新不是追赶谁，而是每天回来，都比昨天更懂一点。"]},{"id":141,"name":"慢下来","chapter":"第七章  时间与成长","layers":["快不一定近，慢有时才是直达。","小时候：以为慢就是落后，跑得快才是本事。\n年轻时：习惯加速，把每一分钟都塞满。\n经历半生：明白有些事只能慢慢来，快了反而要重做。","慢下来不是拖沓，也不是放弃效率。","每周给一件事留出「不赶时间」的余量，比如做饭、看书、陪人聊天。","慢下来不是停下来，而是让心跟得上脚。"]},{"id":142,"name":"成长","chapter":"第七章  时间与成长","layers":["更新理解，而不只增加成绩。","小时候：以为时间很长，成长就是一年比一年懂得更多。\n年轻时：容易用进度和成绩判断自己有没有浪费光阴。\n经历半生：再看“成长”，才更懂得——更新理解，而不只增加成绩。","成长不只表现为更高的成绩。","每年记录一次自己对同一个词的新理解。","真正的成长，不是一句说出口的道理，而是每天愿意践行的选择。更新理解，而不只增加成绩。"]},{"id":143,"name":"盼头","chapter":"第七章  时间与成长","layers":["有件值得期待的事，日子就有劲。","小时候：以为盼头就是过年、放长假。\n年轻时：容易把期待放在很远的地方，眼下的日子显得没意思。\n经历半生：明白会给自己造盼头的人，才不会把日子过成一条平线。","盼头不是空等好事，也不是逃避现在。","这个月给自己定一件「值得期待的小事」，提前写进日历，认真等它。","盼头不是未来才有的东西，而是你现在就开始准备的明天。"]},{"id":144,"name":"成熟","chapter":"第七章  时间与成长","layers":["知道能做什么，也承认做不到什么。","小时候：以为时间很长，成长就是一年比一年懂得更多。\n年轻时：容易用进度和成绩判断自己有没有浪费光阴。\n经历半生：再看“成熟”，才更懂得——知道能做什么，也承认做不到什么。","成熟不意味着永远不哭不怕。","承认精力有限，给家庭、健康和事业重新排序。","真正的成熟，不是一句说出口的道理，而是每天愿意践行的选择。知道能做什么，也承认做不到什么。"]},{"id":145,"name":"不着急","chapter":"第七章  时间与成长","layers":["该长的东西，催不得。","小时候：以为不着急就是慢慢做、不催自己。\n年轻时：容易对结果太急，对过程太敷衍。\n经历半生：知道播种和收成之间，隔着一整个季节。","不着急不是不努力，也不是懒得规划。","给自己定一个「三年后再看」的计划，今天只做其中一小步。","不着急不是不想要，而是相信时间会把该长的东西长出来。"]},{"id":146,"name":"积累","chapter":"第七章  时间与成长","layers":["让微小而持续的行动产生力量。","小时候：以为时间很长，成长就是一年比一年懂得更多。\n年轻时：容易用进度和成绩判断自己有没有浪费光阴。\n经历半生：再看“积累”，才更懂得——让微小而持续的行动产生力量。","积累不是盲目增加，方向也很重要。","每天做一件小而长期有价值的事。","真正的积累，不是一句说出口的道理，而是每天愿意践行的选择。让微小而持续的行动产生力量。"]},{"id":147,"name":"沉淀","chapter":"第七章  时间与成长","layers":["把经历慢慢转化成可用的智慧。","小时候：以为时间很长，成长就是一年比一年懂得更多。\n年轻时：容易用进度和成绩判断自己有没有浪费光阴。\n经历半生：再看“沉淀”，才更懂得——把经历慢慢转化成可用的智慧。","沉淀不是把情绪一直压下去。","重大经历过后，留时间写下学到的东西。","真正的沉淀，不是一句说出口的道理，而是每天愿意践行的选择。把经历慢慢转化成可用的智慧。"]},{"id":148,"name":"余生","chapter":"第七章  时间与成长","layers":["剩下的日子，要挑着过。","小时候：以为余生就是很久很久以后。\n年轻时：觉得时间用不完，很多话可以以后再说。\n经历半生：开始算日子了，才发现余生其实不算长。","余生不是等着结束，也不是放弃计划。","写下三件「余生想做但一直没做」的事，今年先做掉一件。","余生不是人生的余数，而是终于可以自己选的那一段。"]},{"id":149,"name":"反思","chapter":"第七章  时间与成长","layers":["温和地复盘，而不是反复责难自己。","小时候：以为时间很长，成长就是一年比一年懂得更多。\n年轻时：容易用进度和成绩判断自己有没有浪费光阴。\n经历半生：再看“反思”，才更懂得——温和地复盘，而不是反复责难自己。","反思不是追责自己。","复盘一次项目，用“下次如何改进”代替“为什么我不够好”。","真正的反思，不是一句说出口的道理，而是每天愿意践行的选择。温和地复盘，而不是反复责难自己。"]},{"id":150,"name":"悟性","chapter":"第七章  时间与成长","layers":["从平常经验里看出更深的道理。","小时候：以为时间很长，成长就是一年比一年懂得更多。\n年轻时：容易用进度和成绩判断自己有没有浪费光阴。\n经历半生：再看“悟性”，才更懂得——从平常经验里看出更深的道理。","悟性不是天生知道一切。","从一件平常小事提炼一句值得记住的话。","真正的悟性，不是一句说出口的道理，而是每天愿意践行的选择。从平常经验里看出更深的道理。"]},{"id":151,"name":"回望","chapter":"第七章  时间与成长","layers":["回头看一眼，才知道自己走了多远。","小时候：以为回望就是怀念过去、想从前。\n年轻时：怕回头看会显得自己不够往前。\n经历半生：明白回望不是停住，是给自己一个交账的机会。","回望不是沉溺过去，也不是自我否定。","每年年底写一页「这一年我扛住了什么」，写完收起来，不评价好坏。","回望不是往回走，而是知道来路，才敢走得明白。"]},{"id":152,"name":"无常","chapter":"第七章  时间与成长","layers":["明白变化是生命的常态而非意外。","小时候：以为时间很长，成长就是一年比一年懂得更多。\n年轻时：容易用进度和成绩判断自己有没有浪费光阴。\n经历半生：再看“无常”，才更懂得——明白变化是生命的常态而非意外。","无常不是不幸，而是万事都有变化。","珍惜眼前的相处，不为尚未来临的变化提前消耗今天。","真正的无常，不是一句说出口的道理，而是每天愿意践行的选择。明白变化是生命的常态而非意外。"]},{"id":153,"name":"光阴","chapter":"第七章  时间与成长","layers":["把不可追回的时间看作珍贵资源。","小时候：以为时间很长，成长就是一年比一年懂得更多。\n年轻时：容易用进度和成绩判断自己有没有浪费光阴。\n经历半生：再看“光阴”，才更懂得——把不可追回的时间看作珍贵资源。","珍惜光阴不是让每分钟都有产出。","给重要的人和事固定时间，不让它们永远排在工作后面。","真正的光阴，不是一句说出口的道理，而是每天愿意践行的选择。把不可追回的时间看作珍贵资源。"]},{"id":154,"name":"半生","chapter":"第七章  时间与成长","layers":["一半已过，一半还在手里。","小时候：以为半生是大人的事，离自己很远。\n年轻时：觉得人生才刚开始，什么都还来得及。\n经历半生：忽然发现自己已经站在这条线的中间。","半生不是认老，也不是清算失败。","列出这一半人生里做成的三件事，认真承认它们，不许自谦。","半生不是终点前的倒计时，而是刚好有能力从头再选一次的路口。"]},{"id":155,"name":"岁月","chapter":"第七章  时间与成长","layers":["允许经历改变自己对世界的看法。","小时候：以为时间很长，成长就是一年比一年懂得更多。\n年轻时：容易用进度和成绩判断自己有没有浪费光阴。\n经历半生：再看“岁月”，才更懂得——允许经历改变自己对世界的看法。","岁月不会自动带来智慧，需要回看与理解。","回看十年前的自己，理解当时的选择而不苛责。","真正的岁月，不是一句说出口的道理，而是每天愿意践行的选择。允许经历改变自己对世界的看法。"]},{"id":156,"name":"圆满","chapter":"第七章  时间与成长","layers":["不要求毫无缺口，也能对人生点头。","小时候：以为圆满就是每个故事都有大团圆结局。\n年轻时：以为所有目标都实现、人生没有遗憾才算圆满。\n经历半生：开始理解带着缺憾仍能感激、理解并肯定自己的一生。","误区：圆满不要求无病无忧、永不失去，也不要求人人满意。","生活修炼：回看一段不如愿的经历，问它给了自己什么，而不只问失去了什么。","金句：圆满不是事事如愿，而是走完一生，能够温柔地对自己点头。"]},{"id":157,"name":"不回头","chapter":"第七章  时间与成长","layers":["走过的地方，不必反复丈量。","小时候：以为不回头就是走的时候不哭。\n年轻时：容易在同一个决定上反复推演「如果当初」。\n经历半生：明白有些路回头看一百次，也还是那条路。","不回头不是不反思，也不是逃避责任。","想到「如果当初」时，立刻补一句「但那时我只能那样选」，然后继续手上的事。","不回头不是忘了来路，而是不再用一个旧的自己，惩罚现在的自己。"]},{"id":158,"name":"谦逊","chapter":"第八章  品格与修养","layers":["有能力时仍愿意听见不同声音。","小时候：常把它理解为老师教导的“做好人”。\n年轻时：可能更关心它能否帮助自己赢得信任与认可。\n经历半生：再看“谦逊”，才更懂得——有能力时仍愿意听见不同声音。","谦逊不是贬低自己的能力。","在自己熟悉的领域，仍主动听一位年轻同事的意见。","真正的谦逊，不是一句说出口的道理，而是每天愿意践行的选择。有能力时仍愿意听见不同声音。"]},{"id":159,"name":"厚道","chapter":"第八章  品格与修养","layers":["在自己有余地时，也给别人留余地。","小时候：常把它理解为老师教导的“做好人”。\n年轻时：可能更关心它能否帮助自己赢得信任与认可。\n经历半生：再看“厚道”，才更懂得——在自己有余地时，也给别人留余地。","厚道不是没有底线地吃亏。","谈合作时留意对方是否也获得合理回报。","真正的厚道，不是一句说出口的道理，而是每天愿意践行的选择。在自己有余地时，也给别人留余地。"]},{"id":160,"name":"善意","chapter":"第八章  品格与修养","layers":["能帮一把的时候，帮一把。","小时候：以为善意就是做好人好事、被老师表扬。\n年轻时：容易觉得善良会吃亏，遇事先想自己。\n经历半生：明白做过的好事会留在心里，成为不小的力量。","善意不是无底线付出，也不是要人回报。","每周做一件不必留名的小事，帮一个人，别让他知道是你。","善意不是软弱，而是有力量，却选择不用在伤人的地方。"]},{"id":161,"name":"践诺","chapter":"第八章  品格与修养","layers":["说过的话，就要算数。","小时候：以为守信就是不撒谎。\n年轻时：容易为了当下的人和气，答应下做不到的事。\n经历半生：明白信用不是一次大事撑起来的，是一次次小事攒起来的。","守信不是死守承诺，也不是不会变通。","答应任何事之前，先说「我看一下时间，晚点回复你」，别当场应下。","守信不是从不说错话，而是发现自己做不到时，第一时间说明。"]},{"id":162,"name":"正直","chapter":"第八章  品格与修养","layers":["无人监督时仍尊重自己的原则。","小时候：常把它理解为老师教导的“做好人”。\n年轻时：可能更关心它能否帮助自己赢得信任与认可。\n经历半生：再看“正直”，才更懂得——无人监督时仍尊重自己的原则。","正直不是用自己的标准苛求所有人。","无人查看时也按原则记录账目和履行承诺。","真正的正直，不是一句说出口的道理，而是每天愿意践行的选择。无人监督时仍尊重自己的原则。"]},{"id":163,"name":"心正","chapter":"第八章  品格与修养","layers":["心里没有歪的地方，路就走得直。","小时候：以为心正就是不做坏事。\n年轻时：容易在小利益面前松动，「就这一次」用得越来越顺。\n经历半生：明白能一直守住底线的人，活得最轻松。","心正不是不会犯错，也不是道德优越感。","每次做决定前问一句：这件事如果被公开，我能不能坦然。","心正不是不会动摇，而是动摇之后，还是选了对的那一边。"]},{"id":164,"name":"诚信","chapter":"第八章  品格与修养","layers":["让承诺与行动有真实的对应。","小时候：常把它理解为老师教导的“做好人”。\n年轻时：可能更关心它能否帮助自己赢得信任与认可。\n经历半生：再看“诚信”，才更懂得——让承诺与行动有真实的对应。","诚信不是承诺任何做不到的事。","对做不到的承诺尽早说明，而非拖延掩饰。","真正的诚信，不是一句说出口的道理，而是每天愿意践行的选择。让承诺与行动有真实的对应。"]},{"id":165,"name":"体面","chapter":"第八章  品格与修养","layers":["输了事情，不必输掉样子。","小时候：以为体面就是穿得干净、打扮好看。\n年轻时：容易把体面当成别人眼里的风光。\n经历半生：知道真正的体面，是难处里还守得住的那份分寸。","体面不是虚荣，也不是硬撑场面。","遇到难堪的场合，先不出声，把情绪收住，回去再处理。","体面不是给别人看的排场，而是自己在难处里还剩的那份尊严。"]},{"id":166,"name":"谦和","chapter":"第八章  品格与修养","layers":["有本事，也不必让人有压力。","小时候：以为谦和就是礼貌、不张扬。\n年轻时：容易把才华当武器，说话非要占上风。\n经历半生：明白真正让人愿意靠近的，是本事大而姿态低。","谦和不是没有主见，也不是故意示弱。","被夸奖时只说一句「谢谢」，不必再加十句自谦，也不必炫耀别的。","谦和不是把自己放低，而是让别人在你面前不必紧张。"]},{"id":167,"name":"仁爱","chapter":"第八章  品格与修养","layers":["把他人的处境也放进自己的考虑。","小时候：常把它理解为老师教导的“做好人”。\n年轻时：可能更关心它能否帮助自己赢得信任与认可。\n经历半生：再看“仁爱”，才更懂得——把他人的处境也放进自己的考虑。","仁爱不是忽视自己的需求。","帮助有需要的人前，先了解他们的真实处境。","真正的仁爱，不是一句说出口的道理，而是每天愿意践行的选择。把他人的处境也放进自己的考虑。"]},{"id":168,"name":"利他","chapter":"第八章  品格与修养","layers":["让自己的能力为别人带来真实益处。","小时候：常把它理解为老师教导的“做好人”。\n年轻时：可能更关心它能否帮助自己赢得信任与认可。\n经历半生：再看“利他”，才更懂得——让自己的能力为别人带来真实益处。","利他不是以自我耗尽为代价。","选择一项能持续帮助他人、又不损耗自己的公益行动。","真正的利他，不是一句说出口的道理，而是每天愿意践行的选择。让自己的能力为别人带来真实益处。"]},{"id":169,"name":"勤勉","chapter":"第八章  品格与修养","layers":["手上有活，心里就不空。","小时候：以为勤勉就是听大人话、干活不偷懒。\n年轻时：容易求快不求好，做完了事却不做扎实。\n经历半生：明白真正让人放心的，是交出去的东西经得起看。","勤勉不是瞎忙，也不是用忙碌证明自己。","做一件事时关掉手机通知，认真做完再起身，哪怕只用一个小时。","勤勉不是不停干活，而是把它做好的那份心，一直没丢。"]},{"id":170,"name":"厚德","chapter":"第八章  品格与修养","layers":["能容人，才载得住事。","小时候：以为厚德就是老好人，谁都说好。\n年轻时：容易欣赏聪明和本事，不太看重一个人是否厚道。\n经历半生：才明白走得远的，往往是那些让人放心的人。","厚德不是软弱，也不是无原则的宽容。","对下属或晚辈多做一件不图回报的小事，比如帮他介绍一次机会。","厚德不是把自己压低，而是让别人在你身边觉得安全。"]},{"id":171,"name":"慷慨","chapter":"第八章  品格与修养","layers":["分享资源与善意，而非透支自己。","小时候：常把它理解为老师教导的“做好人”。\n年轻时：可能更关心它能否帮助自己赢得信任与认可。\n经历半生：再看“慷慨”，才更懂得——分享资源与善意，而非透支自己。","慷慨不必超越自己的承受能力。","给出自己有余力分享的时间、知识或资源。","真正的慷慨，不是一句说出口的道理，而是每天愿意践行的选择。分享资源与善意，而非透支自己。"]},{"id":172,"name":"节制","chapter":"第八章  品格与修养","layers":["不让过量欲望吞噬已经拥有的美好。","小时候：常把它理解为老师教导的“做好人”。\n年轻时：可能更关心它能否帮助自己赢得信任与认可。\n经历半生：再看“节制”，才更懂得——不让过量欲望吞噬已经拥有的美好。","节制不是拒绝享受。","分清“需要”“喜欢”和“为了证明而购买”。","真正的节制，不是一句说出口的道理，而是每天愿意践行的选择。不让过量欲望吞噬已经拥有的美好。"]},{"id":173,"name":"自省","chapter":"第八章  品格与修养","layers":["出了事，先看自己那一份。","小时候：以为自省就是认错、写检讨。\n年轻时：容易在出问题时先找外部原因，心里才舒服。\n经历半生：明白能看见自己问题的人，才不会再走进同一个坑。","自省不是自我攻击，也不是把责任全归自己。","每周问一次：这周有哪件事，如果我换个做法会更好？写一句就行。","自省不是把自己贬低，而是把自己看得更清楚。"]},{"id":174,"name":"守信","chapter":"第八章  品格与修养","layers":["认真对待别人基于承诺交付的信赖。","小时候：常把它理解为老师教导的“做好人”。\n年轻时：可能更关心它能否帮助自己赢得信任与认可。\n经历半生：再看“守信”，才更懂得——认真对待别人基于承诺交付的信赖。","守信也包括诚实说明情况已改变。","按时回应约定事项，变化时及时沟通。","真正的守信，不是一句说出口的道理，而是每天愿意践行的选择。认真对待别人基于承诺交付的信赖。"]},{"id":175,"name":"公正","chapter":"第八章  品格与修养","layers":["判断时不只看自己能得到什么。","小时候：常把它理解为老师教导的“做好人”。\n年轻时：可能更关心它能否帮助自己赢得信任与认可。\n经历半生：再看“公正”，才更懂得——判断时不只看自己能得到什么。","公正不是人人得到相同，而是考虑合宜的依据。","分配工作与报酬时说明公开合理的依据。","真正的公正，不是一句说出口的道理，而是每天愿意践行的选择。判断时不只看自己能得到什么。"]},{"id":176,"name":"守拙","chapter":"第八章  品格与修养","layers":["聪明用在正处，不必处处显摆。","小时候：以为守拙就是装笨、不显眼。\n年轻时：急着让别人看见自己的聪明，话说得比想得快。\n经历半生：才明白锋芒收得住的人，往往走得最远。","守拙不是真的愚笨，也不是藏私不教人。","开会时先让别人说完，最后一个开口，把想说的三句压缩成一句。","守拙不是不聪明，而是不急着证明自己聪明。"]},{"id":177,"name":"温柔","chapter":"第八章  品格与修养","layers":["有力量也有不伤人的方式。","小时候：常把它理解为老师教导的“做好人”。\n年轻时：可能更关心它能否帮助自己赢得信任与认可。\n经历半生：再看“温柔”，才更懂得——有力量也有不伤人的方式。","温柔不是软弱。","需要拒绝时，保持清晰，同时不羞辱对方。","真正的温柔，不是一句说出口的道理，而是每天愿意践行的选择。有力量也有不伤人的方式。"]},{"id":178,"name":"宽厚","chapter":"第八章  品格与修养","layers":["面对人的局限时仍保留善意。","小时候：常把它理解为老师教导的“做好人”。\n年轻时：可能更关心它能否帮助自己赢得信任与认可。\n经历半生：再看“宽厚”，才更懂得——面对人的局限时仍保留善意。","宽厚不是纵容重复的伤害。","允许别人有纠错的机会，同时守住必要界限。","真正的宽厚，不是一句说出口的道理，而是每天愿意践行的选择。面对人的局限时仍保留善意。"]},{"id":179,"name":"敬畏心","chapter":"第八章  品格与修养","layers":["有些东西，不能随便动。","小时候：以为害怕就是胆小。\n年轻时：容易什么都不怕，觉得规矩是给普通人的。\n经历半生：明白人一旦什么都不敬畏，就容易把事做过头。","敬畏心不是迷信，也不是畏手畏脚。","面对健康、金钱、他人的信任，做决定前多问一句：最坏的结果我承担得起吗？","敬畏心不是胆小，而是知道这世上有些事，不该由自己说了算。"]},{"id":180,"name":"敬畏","chapter":"第九章  人与世界","layers":["承认自身有限，认真对待生命和规律。","小时候：觉得世界的道理总有一个清楚的答案。\n年轻时：遇到挑战会更想找到正确方法，让事情重新可控。\n经历半生：再看“敬畏”，才更懂得——承认自身有限，认真对待生命和规律。","敬畏不是胆小，而是知道世界不只围绕自己转。","涉及医疗和安全问题时，坚持专业标准，不以经验代替合规。","真正的敬畏，不是一句说出口的道理，而是每天愿意践行的选择。承认自身有限，认真对待生命和规律。"]},{"id":181,"name":"谦卑","chapter":"第九章  人与世界","layers":["不把一时的经验当成全部真理。","小时候：觉得世界的道理总有一个清楚的答案。\n年轻时：遇到挑战会更想找到正确方法，让事情重新可控。\n经历半生：再看“谦卑”，才更懂得——不把一时的经验当成全部真理。","谦卑不是失去主见。","面对自己不懂的领域，主动求证而非自信猜测。","真正的谦卑，不是一句说出口的道理，而是每天愿意践行的选择。不把一时的经验当成全部真理。"]},{"id":182,"name":"拥抱变化","chapter":"第九章  人与世界","layers":["世界在动，你也别站着。","小时候：以为变化就是换老师、换同桌，心里抵触。\n年轻时：容易害怕改变，宁愿守着熟悉的不舒服。\n经历半生：明白变化里有风险，但也有不再重复以前的机会。","拥抱变化不是随波逐流，也不是盲目跟风。","遇到新的做法，先试着用一次，再判断好坏，不凭第一眼的抵触。","拥抱变化不是没有立场，而是有新东西来时，愿意先打开门看看。"]},{"id":183,"name":"知止","chapter":"第九章  人与世界","layers":["知道哪里该停。","小时候：以为知止就是不懂可以问。\n年轻时：觉得多做一点总是好的，事情越做越多，边界越推越远。\n经历半生：明白懂得停下来的人，反而保住了更多。","知止不是不求上进，也不是半途而废。","给每件事定一个「到此为止」的标准，达标就收手，不追加。","知止不是错过机会，而是知道什么该给自己留下。"]},{"id":184,"name":"理性","chapter":"第九章  人与世界","layers":["让事实参与决定，而非只有感受。","小时候：觉得世界的道理总有一个清楚的答案。\n年轻时：遇到挑战会更想找到正确方法，让事情重新可控。\n经历半生：再看“理性”，才更懂得——让事实参与决定，而非只有感受。","理性不是消灭感情。","把担心的事列出证据和可能性，再决定行动。","真正的理性，不是一句说出口的道理，而是每天愿意践行的选择。让事实参与决定，而非只有感受。"]},{"id":185,"name":"清明","chapter":"第九章  人与世界","layers":["在情绪和欲望之外保持辨别力。","小时候：觉得世界的道理总有一个清楚的答案。\n年轻时：遇到挑战会更想找到正确方法，让事情重新可控。\n经历半生：再看“清明”，才更懂得——在情绪和欲望之外保持辨别力。","清明不是永远不迷惘。","情绪强烈时暂缓重大财务决定。","真正的清明，不是一句说出口的道理，而是每天愿意践行的选择。在情绪和欲望之外保持辨别力。"]},{"id":186,"name":"分寸尺度","chapter":"第九章  人与世界","layers":["好与坏之间，还有一个度。","小时候：以为对就是对、错就是错，分得很清楚。\n年轻时：容易走极端，要么全给，要么全不给。\n经历半生：明白很多事情的答案在一个恰当的度上。","分寸尺度不是和稀泥，也不是没有立场。","遇到让人觉得「给多了」的情况，先缩小一半，看看结果怎么样。","分寸不是折中，而是找到那个恰好合适的位置。"]},{"id":187,"name":"超脱","chapter":"第九章  人与世界","layers":["暂时退开自我得失，放宽观察角度。","小时候：觉得世界的道理总有一个清楚的答案。\n年轻时：遇到挑战会更想找到正确方法，让事情重新可控。\n经历半生：再看“超脱”，才更懂得——暂时退开自我得失，放宽观察角度。","超脱不是冷漠旁观，而是适时扩大视角。","暂时站到多年以后，重新看眼前的得失。","真正的超脱，不是一句说出口的道理，而是每天愿意践行的选择。暂时退开自我得失，放宽观察角度。"]},{"id":188,"name":"随和","chapter":"第九章  人与世界","layers":["对小事留有弹性，对原则保有坚定。","小时候：觉得世界的道理总有一个清楚的答案。\n年轻时：遇到挑战会更想找到正确方法，让事情重新可控。\n经历半生：再看“随和”，才更懂得——对小事留有弹性，对原则保有坚定。","随和不是没有原则。","在无关原则的小事上，允许别人用不同方式完成。","真正的随和，不是一句说出口的道理，而是每天愿意践行的选择。对小事留有弹性，对原则保有坚定。"]},{"id":189,"name":"换个角度看","chapter":"第九章  人与世界","layers":["站在他的位置，事情是另一个样子。","小时候：以为对错只有一个，看得见就知道。\n年轻时：容易站在自己的立场上判断所有人。\n经历半生：明白多数冲突不是谁坏，而是各自看到了不同的部分。","换角度不是没有原则，也不是和稀泥。","不同意见时，先复述一遍对方的理由，直到对方说「对，我就是这个意思」。","换角度不是放弃自己，而是让自己的判断多一个来源。"]},{"id":190,"name":"平衡","chapter":"第九章  人与世界","layers":["让事业、关系、健康与内心都有位置。","小时候：觉得世界的道理总有一个清楚的答案。\n年轻时：遇到挑战会更想找到正确方法，让事情重新可控。\n经历半生：再看“平衡”，才更懂得——让事业、关系、健康与内心都有位置。","平衡不是每件事平均分配时间。","为健康、关系、工作和独处各留实际时间。","真正的平衡，不是一句说出口的道理，而是每天愿意践行的选择。让事业、关系、健康与内心都有位置。"]},{"id":191,"name":"和解","chapter":"第九章  人与世界","layers":["停止对无法改变的部分持续内耗。","小时候：觉得世界的道理总有一个清楚的答案。\n年轻时：遇到挑战会更想找到正确方法，让事情重新可控。\n经历半生：再看“和解”，才更懂得——停止对无法改变的部分持续内耗。","和解不一定需要对方道歉，也不等于继续亲近。","停止反复向过去讨一个不可能补回来的答案。","真正的和解，不是一句说出口的道理，而是每天愿意践行的选择。停止对无法改变的部分持续内耗。"]},{"id":192,"name":"见识","chapter":"第九章  人与世界","layers":["走过的路，会变成看事的角度。","小时候：以为见识就是知道得多、看过得多。\n年轻时：容易把见得多当成懂得多。\n经历半生：明白真正的见识，是从别人的活法里学会了不轻易否定。","见识不是炫耀，也不是比别人高明。","每年去一个自己不熟悉的地方，看别人怎么生活，不做评价。","见识不是走过多少地方，而是看过之后，眼睛变得柔和。"]},{"id":193,"name":"放宽","chapter":"第九章  人与世界","layers":["给自己、他人和事情多一点余地。","小时候：觉得世界的道理总有一个清楚的答案。\n年轻时：遇到挑战会更想找到正确方法，让事情重新可控。\n经历半生：再看“放宽”，才更懂得——给自己、他人和事情多一点余地。","放宽不等于放纵。","给团队一点试错空间，而不是要求首次就完美。","真正的放宽，不是一句说出口的道理，而是每天愿意践行的选择。给自己、他人和事情多一点余地。"]},{"id":194,"name":"理解无常","chapter":"第九章  人与世界","layers":["知道变化发生时不必先认定是惩罚。","小时候：觉得世界的道理总有一个清楚的答案。\n年轻时：遇到挑战会更想找到正确方法，让事情重新可控。\n经历半生：再看“理解无常”，才更懂得——知道变化发生时不必先认定是惩罚。","理解无常不是为未来的失去提前悲伤。","制定备用计划，然后继续认真生活。","真正的理解无常，不是一句说出口的道理，而是每天愿意践行的选择。知道变化发生时不必先认定是惩罚。"]},{"id":195,"name":"与人为善","chapter":"第九章  人与世界","layers":["能让人方便一点，就方便一点。","小时候：以为与人为善就是对人笑、说好话。\n年轻时：容易在利益面前先想自己，事后又觉得心里不舒服。\n经历半生：发现帮过的人不一定回报，但自己心里会松快很久。","与人为善不是讨好，也不是无底线付出。","每周做一件微小的事帮一个人，不必让他知道，也不必等回应。","与人为善不是要人感激，而是让自己活得不必时时设防。"]},{"id":196,"name":"顺势","chapter":"第九章  人与世界","layers":["看见条件与时机，再选择有效的行动。","小时候：觉得世界的道理总有一个清楚的答案。\n年轻时：遇到挑战会更想找到正确方法，让事情重新可控。\n经历半生：再看“顺势”，才更懂得——看见条件与时机，再选择有效的行动。","顺势不是随波逐流。","在政策尚未明确时准备可逆事项，暂缓不可逆投入。","真正的顺势，不是一句说出口的道理，而是每天愿意践行的选择。看见条件与时机，再选择有效的行动。"]},{"id":197,"name":"开阔","chapter":"第九章  人与世界","layers":["让眼前难题不遮住更大的人生。","小时候：觉得世界的道理总有一个清楚的答案。\n年轻时：遇到挑战会更想找到正确方法，让事情重新可控。\n经历半生：再看“开阔”，才更懂得——让眼前难题不遮住更大的人生。","开阔不是忽略眼前的痛苦。","遇到一个项目受阻时，提醒自己人生还有家庭、友谊与兴趣。","真正的开阔，不是一句说出口的道理，而是每天愿意践行的选择。让眼前难题不遮住更大的人生。"]},{"id":198,"name":"周旋","chapter":"第九章  人与世界","layers":["顺着水走，比逆着推省力。","小时候：以为顺势就是听话、跟着大家走。\n年轻时：容易和一切都较劲，觉得妥协就是失败。\n经历半生：明白很多时候，接受现实的前提，才谈得上改变现实。","顺势不是随波逐流，也不是放弃主张。","遇到推不动的事，先问：这件事里哪一部分是可以借力的？先从那部分开始。","顺势不是投降，而是用河水的力气推自己的船。"]},{"id":199,"name":"智慧","chapter":"第十章  人生的终极追求","layers":["分得清何时坚持、何时放手。","小时候：觉得美好的人生应当处处顺利。\n年轻时：容易以成就、拥有和他人的评价衡量人生是否成功。\n经历半生：再看“智慧”，才更懂得——分得清何时坚持、何时放手。","智慧不是知道更多，而是更懂取舍。","遇到两难，先问哪一个选择更贴近长远价值。","真正的智慧，不是一句说出口的道理，而是每天愿意践行的选择。分得清何时坚持、何时放手。"]},{"id":200,"name":"通达","chapter":"第十章  人生的终极追求","layers":["理解世事复杂，仍能过得明白。","小时候：觉得美好的人生应当处处顺利。\n年轻时：容易以成就、拥有和他人的评价衡量人生是否成功。\n经历半生：再看“通达”，才更懂得——理解世事复杂，仍能过得明白。","通达不是看什么都无所谓。","认识到别人可能有不同答案，而不必把争论变成输赢。","真正的通达，不是一句说出口的道理，而是每天愿意践行的选择。理解世事复杂，仍能过得明白。"]},{"id":201,"name":"活好当下","chapter":"第十章  人生的终极追求","layers":["此刻就是你唯一真正拥有的时间。","小时候：以为当下就是现在这一刻的事。\n年轻时：容易把大部分时间花在后悔过去和担心未来上。\n经历半生：明白能把今天过好的人，比什么都不会差。","活好当下不是不管以后，也不是及时行乐。","吃饭时就吃饭，走路时就走路，一天里挑一件平常事，专心做它。","活好当下不是不管明天，而是先让今天值得过。"]},{"id":202,"name":"看淡","chapter":"第十章  人生的终极追求","layers":["放在心上的事，可以少一些。","小时候：以为看淡就是不在乎、无所谓。\n年轻时：容易把什么都看得很重，一句闲话反复想好几天。\n经历半生：明白看淡不是不在乎，而是分清哪些值得在乎。","看淡不是消极，也不是放弃努力。","每天睡前删掉一件「其实不重要却想了一天」的事。","看淡不是心里空了，而是心里只留下真正重的东西。"]},{"id":203,"name":"觉悟","chapter":"第十章  人生的终极追求","layers":["看见自己真正追求的价值。","小时候：觉得美好的人生应当处处顺利。\n年轻时：容易以成就、拥有和他人的评价衡量人生是否成功。\n经历半生：再看“觉悟”，才更懂得——看见自己真正追求的价值。","觉悟不是成为完美的人。","定期问“我今天的安排，是否服务于真正想要的人生？”","真正的觉悟，不是一句说出口的道理，而是每天愿意践行的选择。看见自己真正追求的价值。"]},{"id":204,"name":"向阳而生","chapter":"第十章  人生的终极追求","layers":["无论在哪，都朝着光长。","小时候：以为向阳就是喜欢晒太阳。\n年轻时：容易把挫折当成人生的定论，觉得从此就这样了。\n经历半生：明白最难的不是没受挫，是受挫之后还能不能往光亮处去。","向阳而生不是假装没受过伤，也不是强撑乐观。","难过时做一件小而有结果的事，比如收拾一个抽屉、走一段路，让自己动起来。","向阳而生不是人生没有阴影，而是决定把脸转向有光的地方。"]},{"id":205,"name":"安心","chapter":"第十章  人生的终极追求","layers":["不靠每件事的好结果来维持安稳。","小时候：觉得美好的人生应当处处顺利。\n年轻时：容易以成就、拥有和他人的评价衡量人生是否成功。\n经历半生：再看“安心”，才更懂得——不靠每件事的好结果来维持安稳。","安心不是所有风险消失。","用明确计划处理风险，把剩余时间留给生活。","真正的安心，不是一句说出口的道理，而是每天愿意践行的选择。不靠每件事的好结果来维持安稳。"]},{"id":206,"name":"知足惜福","chapter":"第十章  人生的终极追求","layers":["想要的少一点，拥有的就多一点。","小时候：以为知足就是不求上进、容易被满足。\n年轻时：容易一直往前看，眼里只有更好的。\n经历半生：才明白知足不是停下来，而是先把脚下这块地站稳。","知足不是没有目标，也不是不敢要。","每晚写下三件「今天已经有」的事，不必是大事。","知足不是人生的终点，而是让人有力气继续走的起点。"]},{"id":207,"name":"无悔","chapter":"第十章  人生的终极追求","layers":["对选择尽过心，允许结果不完美。","小时候：觉得美好的人生应当处处顺利。\n年轻时：容易以成就、拥有和他人的评价衡量人生是否成功。\n经历半生：再看“无悔”，才更懂得——对选择尽过心，允许结果不完美。","无悔不是从未选错。","认真准备决定，接受当时信息与能力的有限。","真正的无悔，不是一句说出口的道理，而是每天愿意践行的选择。对选择尽过心，允许结果不完美。"]},{"id":208,"name":"无憾","chapter":"第十章  人生的终极追求","layers":["承认遗憾存在，仍觉得此生值得。","小时候：觉得美好的人生应当处处顺利。\n年轻时：容易以成就、拥有和他人的评价衡量人生是否成功。\n经历半生：再看“无憾”，才更懂得——承认遗憾存在，仍觉得此生值得。","无憾不是一生没有遗憾。","把爱和感谢趁早表达，而不是等万事俱备。","真正的无憾，不是一句说出口的道理，而是每天愿意践行的选择。承认遗憾存在，仍觉得此生值得。"]},{"id":209,"name":"洞明","chapter":"第十章  人生的终极追求","layers":["看得开，也放得下。","小时候：以为通达就是什么都懂。\n年轻时：容易把明白道理当成熟，遇到事却还是过不去。\n经历半生：明白真通达的人，是懂得道理，也能在事情上做到。","通达不是世故，也不是什么都看透。","遇到一件想不通的事，先问：这件事里，哪一部分是我改变不了的？先接受那部分。","通达不是把一切看得无所谓，而是看明白了，还能认真过。"]},{"id":210,"name":"旷达","chapter":"第十章  人生的终极追求","layers":["把起伏放入更宽广的生命图景。","小时候：觉得美好的人生应当处处顺利。\n年轻时：容易以成就、拥有和他人的评价衡量人生是否成功。\n经历半生：再看“旷达”，才更懂得——把起伏放入更宽广的生命图景。","旷达不是不在乎。","把一次失意放入十年的人生里重新衡量。","真正的旷达，不是一句说出口的道理，而是每天愿意践行的选择。把起伏放入更宽广的生命图景。"]},{"id":211,"name":"澄明","chapter":"第十章  人生的终极追求","layers":["让心里的判断越来越清楚透亮。","小时候：觉得美好的人生应当处处顺利。\n年轻时：容易以成就、拥有和他人的评价衡量人生是否成功。\n经历半生：再看“澄明”，才更懂得——让心里的判断越来越清楚透亮。","澄明不是永不困惑。","写下真正想要的生活，再删掉只是为了证明而设的目标。","真正的澄明，不是一句说出口的道理，而是每天愿意践行的选择。让心里的判断越来越清楚透亮。"]},{"id":212,"name":"泰然","chapter":"第十章  人生的终极追求","layers":["心里没有悬着的事。","小时候：以为安然就是没有烦恼、什么都不缺。\n年轻时：容易被未完成的事悬着，睡觉都想着。\n经历半生：明白安然是知道有些事要等，可以先放下。","安然不是无所事事，也不是逃避。","睡前一小时写下明天要做的三件事，写完就不再想，交给明天。","安然不是事情都办完了，而是心里没有一件阴着没处理的事。"]},{"id":213,"name":"圆融","chapter":"第十章  人生的终极追求","layers":["在原则与弹性之间找到合适位置。","小时候：觉得美好的人生应当处处顺利。\n年轻时：容易以成就、拥有和他人的评价衡量人生是否成功。\n经历半生：再看“圆融”，才更懂得——在原则与弹性之间找到合适位置。","圆融不是讨好每个人。","坚守核心原则，同时接受做法可以变化。","真正的圆融，不是一句说出口的道理，而是每天愿意践行的选择。在原则与弹性之间找到合适位置。"]},{"id":214,"name":"自得","chapter":"第十章  人生的终极追求","layers":["从自己的节奏和生活中获得满足。","小时候：觉得美好的人生应当处处顺利。\n年轻时：容易以成就、拥有和他人的评价衡量人生是否成功。\n经历半生：再看“自得”，才更懂得——从自己的节奏和生活中获得满足。","自得不是与世隔绝。","试着享受不被评价、不被比较的一天。","真正的自得，不是一句说出口的道理，而是每天愿意践行的选择。从自己的节奏和生活中获得满足。"]},{"id":215,"name":"洒脱","chapter":"第十章  人生的终极追求","layers":["拿得起，也放得下。","小时候：以为洒脱就是不管不顾、说走就走。\n年轻时：容易把洒脱当成逃避责任的借口。\n经历半生：明白真正的洒脱，是把该做的做完了，然后不执着。","洒脱不是任性，也不是不负责。","完成一件事后，主动说一句「这件事到这里就好」，不追加、不返工。","洒脱不是什么都不在乎，而是尽力之后，能接受任何结果。"]},{"id":216,"name":"归真","chapter":"第十章  人生的终极追求","layers":["走过繁华之后重新亲近本心。","小时候：觉得美好的人生应当处处顺利。\n年轻时：容易以成就、拥有和他人的评价衡量人生是否成功。\n经历半生：再看“归真”，才更懂得——走过繁华之后重新亲近本心。","归真不是否定过去的奋斗。","问自己哪种平凡生活仍愿意每天重复。","真正的归真，不是一句说出口的道理，而是每天愿意践行的选择。走过繁华之后重新亲近本心。"]},{"id":217,"name":"自在从容","chapter":"第十章  人生的终极追求","layers":["认真参与人生，也能平静接受人生。","小时候：觉得美好的人生应当处处顺利。\n年轻时：容易以成就、拥有和他人的评价衡量人生是否成功。\n经历半生：再看“自在从容”，才更懂得——认真参与人生，也能平静接受人生。","自在从容不是毫无责任，而是不再被责任完全占据。","让自己既有能力处理重要事务，也有心情享受普通日子。","真正的自在从容，不是一句说出口的道理，而是每天愿意践行的选择。认真参与人生，也能平静接受人生。"]},{"id":218,"name":"有余","chapter":"第十章  人生的终极追求","layers":["留一点空，日子才有回旋。","小时候：以为有余就是有剩、有钱有闲。\n年轻时：习惯把自己用到满格，时间、精力、钱都算得刚好。\n经历半生：明白凡事留有余地的人，遇到意外才不至于被击垮。","有余不是浪费，也不是不敢用。","时间和钱都按八成安排，剩下两成留给突发和意外。","有余不是不求圆满，而是知道人生总有算不到的事。"]}];

function month(){return date().slice(0,7)}
function dayWord(){let start=new Date(new Date().getFullYear(),0,0),today=new Date();return WORDS[Math.floor((today-start)/86400000)%WORDS.length]}
const QUOTES=["从容不是人生无风雨，而是风雨之中仍能选择自己的步伐。","今天不必成为谁，把今天过好，就已经足够。","心里有盼头的人，走再远的路也不觉得累。","温柔是一种力量，它让靠近你的人感到安全。","每天好一点点，一年后回头看，就是一大段路。","不必急，该长的东西，时间会让你收下。","真正的安宁，是心里有一处不必时时迎战的地方。","把注意力放在还拥有的东西上，日子会宽很多。","善意像种子，落在哪儿，哪儿就暖一点。","允许自己休息，不是偷懒，是为了走更远。","喜乐不必等大事，小事里处处是甜。","你能给别人的最好礼物，是好好听他把话说完。","边界不是疏远，是让关系能长久呼吸的空间。","今天也请对自己说一句：我已经做得很好了。","生活的高手，是把平常日子过出滋味的人。","不必样样圆满，缺的那一角，正好透进光来。","心稳的人，不是没有风浪，而是船一直握在自己手里。","愿你今天遇到的每一个人，都因你的存在而舒服一点。","慢一点没关系，方向对了，走得慢也是向前。","珍惜眼前人，是最不费力也最容易被忘记的事。","真正的自由，是当生活不允许你选择时，内心仍然宽阔。","热情不是永远燃烧，是熄了之后还愿意再点一次。","放下不是认输，是把力气省下来给值得的事。","今天的三件小事，胜过明天的三个大计划。","对世界保持一点好奇，人就永远不会真正老去。","日日新不是大变化，是每天回来都比昨天懂一点。","懂得休息的人，才懂得生活。","把脸转向有光的地方，阴影自然落在身后。","感谢今天平安度过，这就是了不起的一天。","余生很长，别慌；余生也很短，别浪费。"];
function dayQuote(){let start=new Date(new Date().getFullYear(),0,0),today=new Date();return QUOTES[Math.floor((today-start)/86400000)%QUOTES.length]}
function toast(message){document.querySelector('.toast')?.remove();let n=document.createElement('div');n.className='toast';n.textContent=message;document.body.append(n);setTimeout(()=>n.remove(),2600)}
function header(){return `<header class="hero"><div class="eyebrow">PERSONAL LIFE DICTIONARY · 私人典藏</div><h1>人生词典</h1><p>半生耕耘，余生从容</p><div class="quote">小时候，我们认识词语；经历半生，我们开始理解词语的分量。</div><div class="stats"><span class="chip">收录 ${WORDS.length} 词</span><span class="chip">已读 ${state.read.length} 词</span><span class="chip">收藏 ${state.favorites.length} 词</span></div></header>`}
const TABS=[['home','首页'],['words','词典'],['notes','感悟'],['diary','日记'],['review','回顾'],['book','册子'],['settings','设置']];
function navigation(){return `<nav class="tabs">${TABS.map(([id,n])=>`<button class="tab ${tab===id?'active':''}" data-tab="${id}">${n}</button>`).join('')}</nav>`}
function wordButton(w){return `<button class="word" data-open="${w.id}"><span class="number">${String(w.id).padStart(3,'0')}</span><b>${esc(w.name)}</b><small>${esc(w.layers[0].replace(/^[^｜]+｜/,''))}</small></button>`}
function home(){let w=dayWord();return `${header()}<div class="sectiontitle">TODAY · 今日一词</div><section class="card"><div class="muted">${date()} · 第 ${w.id} 词</div><h2 style="font-family:serif;font-size:28px;margin-top:6px">${esc(w.name)}</h2><p class="highlight">${esc(w.layers[0])}</p><button class="btn primary" data-open="${w.id}">读一读今天的词 →</button></section><div class="sectiontitle">从这里开始</div><div class="grid">${[1,2,37,14,15,84].map(id=>wordButton(WORDS[id-1])).join('')}</div><div class="sectiontitle">一点提醒 · 每日一句</div><div class="card"><div class="highlight">${esc(dayQuote())}</div><p class="muted">每一个词都值得慢慢体会。无需打卡，也不必赶进度。</p></div>`}
function words(){let chapters=[...new Set(WORDS.map(w=>w.chapter))],arr=WORDS.filter(w=>((w.name+w.chapter+w.layers.join('')).includes(search))&&(chapter==='全部'||w.chapter.replace(/\s+/g,'')===chapter.replace(/\s+/g,''))&&(!favOnly||state.favorites.includes(w.id)));return `<h2>词语目录</h2><input class="input" id="search" placeholder="搜索词语、金句或内容…" value="${esc(search)}"><div class="filters"><select class="select" id="chapter"><option>全部</option>${chapters.map(c=>`<option ${chapter.replace(/\s+/g,'')===c.replace(/\s+/g,'')?'selected':''}>${esc(c)}</option>`).join('')}</select><button class="btn ${favOnly?'primary':''}" data-filterfav="1">☆ 仅看收藏</button></div><div class="muted">找到 ${arr.length} 个词语</div><div class="grid" style="margin-top:13px">${arr.map(wordButton).join('')||'<div class="empty">暂无匹配词语</div>'}</div>`}
function detail(){let w=WORDS.find(x=>x.id===selected);if(!w)return home();let fav=state.favorites.includes(w.id),read=state.read.includes(w.id),ns=state.notes[w.id]||[];let labels=['01 · 一句话读懂','02 · 人生三个阶段','03 · 更深的智慧与误区','04 · 生活中的修炼','05 · 值得收藏的金句'];return `<button class="back" data-back="1">← 返回词典</button><div class="card"><div class="detailtop"><div><div class="muted">${esc(w.chapter)} · ${String(w.id).padStart(3,'0')}</div><h2>${esc(w.name)}</h2></div><button class="btn" data-fav="${w.id}">${fav?'♥ 已收藏':'♡ 收藏'}</button></div>${w.layers.map((s,i)=>`<div class="layer"><div class="layerlabel">${labels[i]}</div><p class="${i===0||i===4?'highlight':''}">${esc(s)}</p></div>`).join('')}<button class="btn ${read?'ghost':'primary'}" data-read="${w.id}">${read?'✓ 已读过':'标记已读'}</button></div><div class="sectiontitle">MY REFLECTION · 我的感悟</div><div class="card"><p class="muted">每一次理解都值得留下。新的感悟不会覆盖旧的记录。</p><textarea class="input textarea" id="word-note" placeholder="今天，我对「${esc(w.name)}」有什么新的理解？"></textarea><div style="margin-top:10px"><button class="btn primary" data-addnote="${w.id}">保存感悟</button></div>${ns.slice().reverse().map(n=>`<div class="note"><div class="notehead"><span class="muted">${esc(n.date)}</span><button class="btn danger" data-del-note="${w.id}|${esc(n.id)}">删除</button></div>${esc(n.text)}</div>`).join('')}</div>`}
function notes(){let items=[];for(const w of WORDS){for(const n of state.notes[w.id]||[])items.push({...n,word:w})}items.sort((a,b)=>b.id.localeCompare(a.id));return `<h2>我的感悟</h2><p class="brief">所有词语下的个人感悟集中在这里。点击词语可以继续补充。</p>${items.length?items.map(n=>`<div class="card"><div class="row"><button class="btn ghost" data-open="${n.word.id}">${esc(n.word.name)} →</button><span class="muted">${esc(n.date)}</span></div><p style="white-space:pre-wrap">${esc(n.text)}</p></div>`).join(''):'<div class="empty card">还没有记录。打开一个喜欢的词语，写下第一段感悟吧。</div>'}`}
function book(){let items=[];for(const w of WORDS){for(const n of state.notes[w.id]||[])items.push({...n,word:w})}items.sort((a,b)=>((a.date||'')+(a.id||'')).localeCompare((b.date||'')+(b.id||'')));
let days=[...new Set(items.map(i=>i.date))].sort();let wordsn=new Set(items.map(i=>i.word.id)).size;
// 连续记录天数（以最后一条记录日为终点）
let streak=0;if(days.length){let d=new Date(days[days.length-1]);for(let i=days.length-1;i>=0;i--){let cur=new Date(days[i]);let diff=Math.round((d-cur)/86400000);if(diff===streak){streak++;}else break;}}
let stat=`<div class="statbar"><div><b>${items.length}</b><span>条感悟</span></div><div><b>${wordsn}</b><span>个词</span></div><div><b>${days.length}</b><span>天记录</span></div><div><b>${streak}</b><span>天连续</span></div></div>`;
let body=items.length?items.map((n,k)=>`<div class="bk-entry"><div class="bk-head"><span class="bk-no">${String(k+1).padStart(2,'0')}</span><b>${esc(n.word.name)}</b><span class="bk-date">${esc(n.date||'')}</span></div><p class="bk-text">${esc(n.text)}</p></div>`).join(''):'<div class="empty">还没有感悟。去「词典」里打开一个词，写下第一段吧。</div>';
return `<div class="bookhead"><h2>我的册子</h2><p class="brief">你写下的感悟会自动汇总成册，随时可以导出保存。</p></div>${stat}<div class="actions"><button class="btn primary" data-printbook="1">导出 PDF / 打印</button></div><div class="bookdoc">${body}</div><p class="bk-foot">人生词典 · 个人册子</p>`}
function diary(){return `<h2>人生修炼日记</h2><p class="brief">记录今天发生了什么、有什么新的领悟。日记仅保存在当前设备。</p><div class="card"><label for="diary-text">今天，我读懂了什么？</label><textarea id="diary-text" class="input textarea" placeholder="今天的经历、情绪、感悟……"></textarea><button class="btn primary" style="margin-top:11px" data-adddiary="1">保存今天的记录</button></div>${state.diary.slice().reverse().map(d=>`<div class="card"><div class="row"><span class="muted">${esc(d.date)}</span><button class="btn danger" data-deldiary="${esc(d.id)}">删除</button></div><p style="white-space:pre-wrap">${esc(d.text)}</p></div>`).join('')}`}
function review(){let ym=month();return `<h2>月度回顾</h2><p class="brief">把这个月的领悟整理成自己的话。可以按月保存多次总结。</p><div class="card"><div class="muted">当前月份 ${ym}</div><textarea id="month-text" class="input textarea" placeholder="这个月，我最有触动的词是什么？我在哪件事上做到了？还有什么希望继续练习？"></textarea><button class="btn primary" data-addmonth="1" style="margin-top:11px">保存本月总结</button></div><div class="sectiontitle">最近收藏</div><div class="grid">${WORDS.filter(w=>state.favorites.includes(w.id)).slice(0,12).map(wordButton).join('')||'<div class="empty">还没有收藏词语</div>'}</div><div class="sectiontitle">往期总结</div>${state.monthly.slice().reverse().map(d=>`<div class="card"><div class="row"><b>${esc(d.month)}</b><button class="btn danger" data-delmonth="${esc(d.id)}">删除</button></div><p style="white-space:pre-wrap">${esc(d.text)}</p></div>`).join('')||'<p class="muted">还没有总结，慢慢来。</p>'}`}
function settings(){return `<h2>设置与备份</h2><div class="warning"><strong>请定期备份个人笔记。</strong><br>这是一份无需联网的单文件词典，阅读内容已经全部包含在文件里。个人笔记、收藏和进度默认保存在当前浏览器的本地存储中；更换手机、清理浏览器数据或某些文件预览环境可能导致记录丢失。建议每周导出一次备份，并保存在“文件”或 iCloud 中。</div><div class="card"><h3>保存自己的记录</h3><p class="muted">导出会生成一个 JSON 备份文件，包含你的收藏、已读记录、感悟、日记和月度总结。</p><div class="toolbar"><button class="btn primary" data-export="1">导出我的备份</button><label class="btn" for="import-file">导入旧备份</label><input type="file" id="import-file" accept=".json,application/json" class="hidden"></div><p class="muted">导入会替换本机现有记录，请先导出当前备份。</p></div><div class="card"><h3>使用说明</h3><p>① 不用登录，不用联网即可阅读全部218个词语。</p><p>② 点击词条后可收藏、标记已读、写下多条感悟。</p><p>③ “日记”和“回顾”分别记录日常体会与每月总结。</p><p>④ 词典原文不可在应用内修改；你自己的感悟可以持续增加。</p><p>⑤ 如果在 iPhone 的“文件”预览里打开后，按钮不能操作或笔记不能保存，请改用支持本地网页脚本和存储的浏览器环境。要像独立 App 那样添加到主屏幕并稳定离线使用，需要将另附的 PWA 版本先部署在 HTTPS 网站并首次联网打开安装。</p></div><div class="card"><h3>关于这本词典</h3><p class="muted">来源：《人生词典·120个词语的五层解析》Word版。收录218词，所有原文完整保留。仅供人生感悟和自我记录。</p></div>`}
function draw(){document.getElementById('app').innerHTML=backupBanner()+(selected!==null?detail():navigation()+({home,words,notes,diary,review,book,settings}[tab]||home)())+'<footer class="footer">🌿 人生词典 · 用简单的词语，读懂复杂的人生</footer>';document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;selected=null;search='';draw();window.scrollTo(0,0)}));document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>{selected=Number(b.dataset.open);tab='words';draw();window.scrollTo(0,0)}));document.querySelector('[data-back]')?.addEventListener('click',()=>{selected=null;draw()});document.querySelector('[data-fav]')?.addEventListener('click',e=>{let id=+e.currentTarget.dataset.fav;state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];persist();draw()});document.querySelector('[data-read]')?.addEventListener('click',e=>{let id=+e.currentTarget.dataset.read;if(!state.read.includes(id))state.read.push(id);persist();draw();toast('已记录阅读进度')});document.querySelector('[data-addnote]')?.addEventListener('click',e=>{let id=+e.currentTarget.dataset.addnote,v=document.getElementById('word-note').value.trim();if(!v)return toast('请先写下感悟');(state.notes[id]??=[]).push({id:String(Date.now()),date:date(),text:v});persist();draw();toast('感悟已保存')});document.querySelectorAll('[data-del-note]').forEach(b=>b.addEventListener('click',()=>{if(!confirm('确定删除这条感悟吗？'))return;let [id,nid]=b.dataset.delNote.split('|');state.notes[id]=(state.notes[id]||[]).filter(x=>x.id!==nid);persist();draw()}));document.querySelector('#search')?.addEventListener('input',e=>{search=e.target.value;let pos=e.target.selectionStart;let s=document.activeElement;draw();let box=document.querySelector('#search');box.focus();box.setSelectionRange(pos,pos)});document.querySelector('#chapter')?.addEventListener('change',e=>{chapter=e.target.value;draw()});document.querySelector('[data-filterfav]')?.addEventListener('click',()=>{favOnly=!favOnly;draw()});document.querySelector('[data-adddiary]')?.addEventListener('click',()=>{let v=document.getElementById('diary-text').value.trim();if(!v)return toast('请先写一点内容');state.diary.push({id:String(Date.now()),date:date(),text:v});persist();draw();toast('日记已保存')});document.querySelectorAll('[data-deldiary]').forEach(b=>b.addEventListener('click',()=>{if(!confirm('删除这条日记？'))return;state.diary=state.diary.filter(x=>x.id!==b.dataset.deldiary);persist();draw()}));document.querySelector('[data-addmonth]')?.addEventListener('click',()=>{let v=document.getElementById('month-text').value.trim();if(!v)return toast('请先写下本月总结');state.monthly.push({id:String(Date.now()),month:month(),text:v});persist();draw();toast('总结已保存')});document.querySelectorAll('[data-delmonth]').forEach(b=>b.addEventListener('click',()=>{if(!confirm('删除这条总结？'))return;state.monthly=state.monthly.filter(x=>x.id!==b.dataset.delmonth);persist();draw()}));document.querySelector('[data-export]')?.addEventListener('click',exportState);document.querySelector('[data-printbook]')?.addEventListener('click',()=>window.print());document.querySelector('#import-file')?.addEventListener('change',importState)}
const BKEY='renshengcidian_lastbackup',BDAYS=30;
function daysSinceBackup(){let t=+localStorage.getItem(BKEY)||0;if(!t)return null;return Math.floor((Date.now()-t)/86400000)}
function backupBanner(){let d=daysSinceBackup();if(d!==null&&d<BDAYS)return '';let m=d===null?'你还没有导出过备份':`距离上次备份已经 ${d} 天`;
return `<div class="backup-tip" onclick="__doBackup()"><span>💾 ${m}，建议导出一份存到「文件」或 iCloud，防止清理缓存后丢失。</span><b>立即备份</b></div>`}
function __doBackup(){document.querySelector('[data-export]')?.click()}
function exportState(){let payload=JSON.stringify({app:'人生词典',version:1,exportedAt:new Date().toISOString(),state},null,2),blob=new Blob([payload],{type:'application/json'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='人生词典_个人备份_'+date()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);localStorage.setItem(BKEY,String(Date.now()));draw();toast('备份文件已生成，请保存到安全位置')}
async function importState(e){let file=e.target.files[0];if(!file)return;try{let data=JSON.parse(await file.text());if(data.app!=='人生词典'||!data.state||!Array.isArray(data.state.favorites)||!Array.isArray(data.state.read)||!data.state.notes||!Array.isArray(data.state.diary)||!Array.isArray(data.state.monthly))throw Error('格式不符合本词典的备份文件');if(!confirm('这会替换当前设备的全部笔记、收藏和进度。确定导入吗？'))return;state={...structuredClone(EMPTY),...data.state};persist();draw();toast('已成功恢复备份')}catch(err){alert('导入失败：'+err.message)}}
draw();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){navigator.serviceWorker.register("./sw.js").catch(()=>{});}
</script></body></html>
